<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Experts Data Explorer</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #16202c;
    --panel-border: #26374a;
    --text: #e6edf5;
    --text-dim: #8fa1b3;
    --accent: #4fc3f7;
    --row-alt: #131d27;
    --row-hover: #1c2e42;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 60px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 2px; }
  h3 { font-size: 0.85rem; margin: 0 0 8px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  p.sub { color: var(--text-dim); margin: 0 0 18px; font-size: 0.85rem; }

  .summary {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 16px;
    min-width: 110px;
  }
  .card .value { font-size: 1.3rem; font-weight: 700; }
  .card .label { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .card.total { border-color: var(--accent); }
  .card.total .value { color: var(--accent); }

  .layout {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  .sidebar {
    flex: 0 0 260px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
  }
  #search {
    width: 100%;
    background: var(--row-alt);
    border: none;
    border-bottom: 1px solid var(--panel-border);
    color: var(--text);
    padding: 10px 12px;
    font-size: 0.85rem;
  }
  #search:focus { outline: none; background: var(--row-hover); }
  .expert-list { max-height: 640px; overflow-y: auto; }
  .expert-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--panel-border);
    font-size: 0.85rem;
  }
  .expert-row:hover { background: var(--row-hover); }
  .expert-row.active { background: var(--row-hover); border-left: 3px solid var(--accent); }
  .expert-row img { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .expert-row .meta { color: var(--text-dim); font-size: 0.72rem; }

  .detail {
    flex: 1;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 20px;
  }

  .detail-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--panel-border);
  }
  .detail-header-left { display: flex; gap: 14px; align-items: center; }
  .detail-header-left img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid var(--panel-border); }

  .stat-group { display: flex; gap: 20px; flex-wrap: wrap; }
  .stat-block { text-align: right; }
  .stat-block .value { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
  .stat-block .label { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-divider { width: 1px; align-self: stretch; background: var(--panel-border); }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    background: var(--row-hover);
    border: 1px solid var(--panel-border);
    margin-right: 6px;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 10px;
  }
  .stat-box {
    background: var(--row-alt);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .stat-box .stat-label { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; }
  .stat-box .stat-value { font-size: 1.05rem; font-weight: 600; }

  .section { margin-bottom: 24px; }

  .skill {
    background: var(--row-alt);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .skill-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .skill-name-row img { width: 28px; height: 28px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .skill-name { font-weight: 600; }
  .skill-desc { font-size: 0.82rem; color: var(--text-dim); margin-bottom: 10px; }
  .extra-list { font-size: 0.78rem; color: var(--text-dim); margin: 8px 0 0; padding-left: 18px; }

  .levels-table-wrap { max-height: 320px; overflow: auto; border: 1px solid var(--panel-border); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.8rem; }
  thead th {
    text-align: left;
    padding: 6px 10px;
    color: var(--text-dim);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--panel-border);
    white-space: nowrap;
    position: sticky;
    top: 0;
    background: var(--row-alt);
  }
  tbody td { padding: 6px 10px; border-bottom: 1px solid var(--panel-border); white-space: nowrap; }
  tbody tr:nth-child(even) { background: var(--bg); }
  .empty { color: var(--text-dim); }
  .rel-icon { width: 28px; height: 28px; object-fit: contain; vertical-align: middle; }

  .empty-detail { color: var(--text-dim); text-align: center; padding: 60px 20px; }

  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    .sidebar { flex-basis: auto; width: 100%; }
    .expert-list { max-height: 260px; }
  }
</style>
</head>

<script>
  const DATA = JSON.parse(document.getElementById('expert-data').textContent);
  const RELATIONSHIPS = JSON.parse(document.getElementById('relationship-data').textContent);

  let searchTerm = '';
  let activeId = DATA[0] ? DATA[0].id : null;

  function fmt(value) {
    return typeof value === 'number' ? value.toLocaleString() : value;
  }

  function buildSummary() {
    const el = document.getElementById('summary');
    const generations = new Set(DATA.map((e) => e.generation));
    const totalSkills = DATA.reduce((sum, e) => sum + e.skills.length, 0);
    const maxAffinityLevel = Math.max(...DATA.flatMap((e) => e.affinityLevels.map((a) => a.level)));
    const powers = DATA.map(expertPower);
    const combinedPower = powers.reduce((sum, p) => sum + p.total, 0);
    const completeCount = powers.filter((p) => p.complete).length;
    const cards = [
      `<div class="card total"><div class="value">${fmt(DATA.length)}</div><div class="label">Total Experts</div></div>`,
      `<div class="card"><div class="value">${fmt(generations.size)}</div><div class="label">Generations</div></div>`,
      `<div class="card"><div class="value">${fmt(totalSkills)}</div><div class="label">Skills Tracked</div></div>`,
      `<div class="card"><div class="value">${fmt(maxAffinityLevel)}</div><div class="label">Max Affinity Level</div></div>`,
      `<div class="card total"><div class="value">${fmt(combinedPower)}</div><div class="label">Combined Max Power${completeCount === DATA.length ? '' : ` (${completeCount} of ${DATA.length} experts with full data)`}</div></div>`,
    ];
    el.innerHTML = cards.join('');
  }

  function getFiltered() {
    if (!searchTerm) return DATA;
    const term = searchTerm.toLowerCase();
    return DATA.filter(
      (e) =>
        e.name.toLowerCase().includes(term) ||
        e.title.toLowerCase().includes(term) ||
        e.specialty.toLowerCase().includes(term),
    );
  }

  function powerLabel(power) {
    return `${fmt(power.total)} power${power.complete ? '' : ' (partial)'}`;
  }

  function renderList() {
    const el = document.getElementById('expert-list');
    const rows = getFiltered();
    if (rows.length === 0) {
      el.innerHTML = '<div class="expert-row" style="cursor:default;color:var(--text-dim)">No experts match.</div>';
      return;
    }
    el.innerHTML = rows
      .map(
        (e) => `<div class="expert-row${e.id === activeId ? ' active' : ''}" data-id="${e.id}">
          <img src="..${e.img}" alt="" onerror="this.style.visibility='hidden'">
          <div>
            <div>${e.name}</div>
            <div class="meta">${e.title} &middot; Gen ${e.generation}</div>
            <div class="meta">${powerLabel(expertPower(e))}</div>
          </div>
        </div>`,
      )
      .join('');
    el.querySelectorAll('.expert-row[data-id]').forEach((row) => {
      row.addEventListener('click', () => {
        activeId = row.dataset.id;
        renderList();
        renderDetail();
      });
    });
  }

  function skillTable(skill) {
    const hasCosts = skill.costs.length > 0;
    const headerCells = [
      '<th>Level</th>',
      ...(hasCosts ? ['<th>EXP</th>', '<th>Books</th>'] : []),
      ...skill.progressions.map((p) => `<th>${p.label}</th>`),
    ].join('');
    const rows = [];
    for (let i = 0; i < skill.maxLevel; i++) {
      const level = i + 1;
      const cost = skill.costs.find((c) => c.level === level);
      const cells = [
        `<td>${level}</td>`,
        ...(hasCosts
          ? [`<td>${cost ? fmt(cost.exp) : '<span class="empty">&mdash;</span>'}</td>`, `<td>${cost ? fmt(cost.books) : '<span class="empty">&mdash;</span>'}</td>`]
          : []),
        ...skill.progressions.map((p) => `<td>${fmt(p.values[i])}</td>`),
      ].join('');
      rows.push(`<tr>${cells}</tr>`);
    }
    return `<div class="levels-table-wrap"><table>
      <thead><tr>${headerCells}</tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table></div>`;
  }

  function milestoneRewardsList(skill) {
    if (!skill.milestoneRewards) return '';
    const items = skill.milestoneRewards
      .map(
        (m) =>
          `<li>Level ${m.levelRequired}: ${m.rewards.map((r) => `${fmt(r.amount)}x ${r.item}`).join(', ')}</li>`,
      )
      .join('');
    return `<ul class="extra-list">${items}</ul>`;
  }

  function lootTableList(skill) {
    if (!skill.lootTable) return '';
    const items = skill.lootTable
      .map((l) => `<li>${l.reward} &mdash; ${l.probabilityPercent}%</li>`)
      .join('');
    return `<ul class="extra-list">${items}</ul>`;
  }

  function skillBlock(skill) {
    const totalExp = skill.costs.reduce((sum, c) => sum + c.exp, 0);
    const totalBooks = skill.costs.reduce((sum, c) => sum + c.books, 0);
    return `<div class="skill">
      <div class="skill-name-row">
        <img src="..${skill.img}" alt="" onerror="this.style.visibility='hidden'">
        <div class="skill-name">${skill.name}</div>
        <span class="badge">Max Lv.${skill.maxLevel}</span>
        ${skill.costs.length > 0 ? `<span class="badge">${fmt(totalExp)} EXP</span><span class="badge">${fmt(totalBooks)} Books</span>` : ''}
      </div>
      <div class="skill-desc">${skill.description}</div>
      ${skillTable(skill)}
      ${milestoneRewardsList(skill)}
      ${lootTableList(skill)}
    </div>`;
  }

  function relationshipCell(level) {
    const start = RELATIONSHIPS.find((r) => r.level === level);
    if (!start) return '<span class="empty">&mdash;</span>';
    return `<img class="rel-icon" src="..${start.img}" alt="" onerror="this.style.visibility='hidden'"> ${start.name}`;
  }

  function affinityTable(affinityLevels) {
    const hasPower = affinityLevels.some((a) => a.levelPower !== undefined);
    const dash = '<span class="empty">&mdash;</span>';
    const rows = affinityLevels
      .map(
        (a) => `<tr>
          <td>${a.level}</td>
          <td>${relationshipCell(a.level)}</td>
          <td>${fmt(a.affinityRequired)}</td>
          <td>${a.advancementCost !== undefined ? fmt(a.advancementCost) : dash}</td>
          <td>${a.statBonus}%</td>
          ${
            hasPower
              ? `<td>${a.levelPower !== undefined ? fmt(a.levelPower) : dash}</td>
          <td>${a.affinityPower !== undefined ? fmt(a.affinityPower) : dash}</td>
          <td>${a.affinityPowerAfterAdvancement !== undefined ? fmt(a.affinityPowerAfterAdvancement) : dash}</td>`
              : ''
          }
        </tr>`,
      )
      .join('');
    const powerHeads = hasPower ? '<th>Level Power</th><th>Affinity Power</th><th>Affinity Power After Advancement</th>' : '';
    return `<div class="levels-table-wrap"><table>
      <thead><tr><th>Level</th><th>Relationship</th><th>Affinity Required</th><th>Sigils</th><th>Stat Bonus</th>${powerHeads}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }

  function maxPower(skill) {
    const power = skill.progressions.find((p) => p.label === 'Power');
    return power ? power.values[power.values.length - 1] : undefined;
  }

  function expertPower(expert) {
    const maxLevel = expert.affinityLevels[expert.affinityLevels.length - 1];
    const skillPowers = expert.skills.map(maxPower);
    const parts = {
      skills: skillPowers.every((p) => p !== undefined) ? skillPowers.reduce((sum, p) => sum + p, 0) : undefined,
      talent: maxPower(expert.talent),
      level: maxLevel.levelPower,
      affinity: maxLevel.affinityPowerAfterAdvancement ?? maxLevel.affinityPower,
    };
    const known = Object.values(parts).filter((p) => p !== undefined);
    return {
      ...parts,
      total: known.reduce((sum, p) => sum + p, 0),
      complete: known.length === Object.keys(parts).length,
    };
  }

  function expertTotals(expert) {
    const totalSigils = expert.affinityLevels.reduce((sum, a) => sum + (a.advancementCost ?? 0), 0);
    const totalAffinity = expert.affinityLevels.reduce((sum, a) => sum + a.affinityRequired, 0);
    const totalBooks = [...expert.skills, expert.talent]
      .flatMap((s) => s.costs)
      .reduce((sum, c) => sum + c.books, 0);
    return { totalSigils, totalAffinity, totalBooks };
  }

  function renderDetail() {
    const el = document.getElementById('detail');
    const expert = DATA.find((e) => e.id === activeId);
    if (!expert) {
      el.innerHTML = '<div class="empty-detail">Select an expert from the list.</div>';
      return;
    }

    const { totalSigils, totalAffinity, totalBooks } = expertTotals(expert);
    const power = expertPower(expert);

    el.innerHTML = `
      <div class="detail-header">
        <div class="detail-header-left">
          <img src="..${expert.img}" alt="" onerror="this.style.visibility='hidden'">
          <div>
            <h2>${expert.name}</h2>
            <span class="badge">${expert.title}</span>
            <span class="badge">${expert.specialty}</span>
            <span class="badge">Gen ${expert.generation}</span>
          </div>
        </div>
        <div class="stat-group">
          <div class="stat-block">
            <div class="value">${fmt(power.total)}</div>
            <div class="label">Max Power${power.complete ? '' : ' (partial)'}</div>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-block">
            <div class="value">${fmt(totalSigils)}</div>
            <div class="label">Total Sigils</div>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-block">
            <div class="value">${fmt(totalAffinity)}</div>
            <div class="label">Total Affinity</div>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-block">
            <div class="value">${fmt(totalBooks)}</div>
            <div class="label">Total Books</div>
          </div>
        </div>
      </div>

      <div class="section">
        <h3>Max Power</h3>
        <div class="stat-grid">
          ${[['Skills at max level', power.skills], ['Talent at max level', power.talent], ['Level 100 level power', power.level], ['Level 100 affinity power after advancement', power.affinity]]
            .map(([label, value]) => `<div class="stat-box"><div class="stat-label">${label}</div><div class="stat-value">${value === undefined ? '<span class="empty">not loaded</span>' : fmt(value)}</div></div>`)
            .join('')}
        </div>
      </div>

      <div class="section">
        <h3>Base Bonuses</h3>
        <div class="stat-grid">
          ${expert.baseBonuses.map((b) => `<div class="stat-box"><div class="stat-label">${b.stat}</div><div class="stat-value">+${b.value}%</div></div>`).join('')}
        </div>
      </div>

      <div class="section">
        <h3>Skills</h3>
        ${expert.skills.map(skillBlock).join('')}
      </div>

      <div class="section">
        <h3>Talent</h3>
        ${skillBlock(expert.talent)}
      </div>

      <div class="section">
        <h3>Affinity (1-${expert.affinityLevels.length})</h3>
        ${affinityTable(expert.affinityLevels)}
      </div>
    `;
  }

  document.getElementById('search').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderList();
  });

  buildSummary();
  renderList();
  renderDetail();
</script>
