<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rookie Events</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #16202c;
    --panel-border: #26374a;
    --text: #e6edf5;
    --text-dim: #8fa1b3;
    --accent: #4fc3f7;
    --row-alt: #131d27;
    --good: #52d17a;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 60px;
  }
  a { color: var(--accent); }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 0.85rem; margin: 22px 0 8px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  p.sub { color: var(--text-dim); margin: 0 0 18px; font-size: 0.85rem; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 6px 14px 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .tab img { width: 24px; height: 24px; border-radius: 5px; }
  .tab.active { background: var(--accent); color: #06222e; border-color: var(--accent); font-weight: 600; }
  .empty { color: var(--text-dim); font-size: 0.9rem; }
  .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 16px; }
  .event-head { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; }
  .event-head img { width: 64px; height: 64px; border-radius: 12px; border: 1px solid var(--panel-border); object-fit: cover; }
  .event-head h3 { margin: 0 0 6px; font-size: 1.15rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: #0f1720; border: 1px solid var(--panel-border); border-radius: 999px; padding: 2px 10px; font-size: 0.75rem; color: var(--text-dim); }
  .description { line-height: 1.45; font-size: 0.92rem; }
  ul.plain { margin: 0; padding-left: 20px; font-size: 0.88rem; line-height: 1.5; }
  .phases { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .phase { background: var(--row-alt); border: 1px solid var(--panel-border); border-radius: 8px; padding: 8px 10px; font-size: 0.85rem; }
  .phase b { display: block; margin-bottom: 2px; }
  .phase span { color: var(--text-dim); font-size: 0.8rem; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .pill {
    background: #0f1720;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 4px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .pill.active { background: var(--accent); color: #06222e; border-color: var(--accent); font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--panel-border); text-align: left; vertical-align: middle; }
  th { color: var(--text-dim); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tbody tr:nth-child(even) td { background: var(--row-alt); }
  td.num { text-align: right; white-space: nowrap; }
  .stars.up { color: var(--good); }
  .stars.down { color: var(--bad); }
  .rewards { display: flex; flex-wrap: wrap; gap: 8px; }
  .reward { display: inline-flex; align-items: center; gap: 6px; }
  .reward .icon { position: relative; width: 40px; height: 40px; flex: none; }
  .reward .icon img { width: 40px; height: 40px; border-radius: 8px; display: block; }
  .reward .icon.missing {
    border: 1px dashed var(--text-dim);
    border-radius: 8px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
  }
  .reward .qty {
    position: absolute;
    right: -2px;
    bottom: -2px;
    background: rgba(6, 12, 18, 0.9);
    border-radius: 6px;
    padding: 0 4px;
    font-size: 0.68rem;
    font-weight: 700;
  }
  .reward .label { font-size: 0.75rem; color: var(--text-dim); max-width: 150px; line-height: 1.2; }
  .scroll { overflow-x: auto; }
</style>
</head>

"1h Troop Training Speedup","itemId":"speedup-troop-1h","amount":7}]},{"groupRanking":"11-20","rewards":[{"name":"Gems","itemId":"gems","amount":3800},{"name":"5m Research Speedup","itemId":"speedup-research-5m","amount":60},{"name":"5m Construction Speedup","itemId":"speedup-construction-5m","amount":60},{"name":"5m Troop Training Speedup","itemId":"speedup-troop-5m","amount":60}]},{"groupRanking":"21-50","rewards":[{"name":"Gems","itemId":"gems","amount":1900},{"name":"5m Research Speedup","itemId":"speedup-research-5m","amount":35},{"name":"5m Construction Speedup","itemId":"speedup-construction-5m","amount":35},{"name":"5m Troop Training Speedup","itemId":"speedup-troop-5m","amount":35}]},{"groupRanking":"51-100","rewards":[{"name":"Gems","itemId":"gems","amount":1000},{"name":"5m Research Speedup","itemId":"speedup-research-5m","amount":25},{"name":"5m Construction Speedup","itemId":"speedup-construction-5m","amount":25},{"name":"5m Troop Training Speedup","itemId":"speedup-troop-5m","amount":25}]}]}],"tips":["Save construction or general speedups for this event to raise your chances at the top rewards."]}]</script>

<script id="heroes-data" type="application/json">{}</script>
<script id="decorations-data" type="application/json">{}</script>
<script id="skins-data" type="application/json">{}</script>
<script>
  const EVENTS = JSON.parse(document.getElementById('events-data').textContent);
  const ITEMS = JSON.parse(document.getElementById('items-data').textContent);
  const HEROES = JSON.parse(document.getElementById('heroes-data').textContent);
  const DECORATIONS = JSON.parse(document.getElementById('decorations-data').textContent);
  const SKINS = JSON.parse(document.getElementById('skins-data').textContent);
  const IMAGE_ROOT = '../..';
  const tabsEl = document.getElementById('tabs');
  const eventEl = document.getElementById('event');
  let activeEventId = EVENTS.length ? EVENTS[0].id : null;
  const activeTierByEvent = {};
  const activeDayByEvent = {};
  const activeLevelsByTier = {};

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function section(title, body) {
    const wrap = el('div');
    wrap.append(el('h2', '', title), body);
    return wrap;
  }

  function bulletList(items) {
    const list = el('ul', 'plain');
    items.forEach((text) => list.append(el('li', '', text)));
    return list;
  }

  function rewardChip(reward) {
    const item = reward.itemId ? ITEMS[reward.itemId] : reward.decorationId ? DECORATIONS[reward.decorationId] : reward.skinId ? SKINS[reward.skinId] : undefined;
    const chip = el('div', 'reward');
    const icon = el('div', item && item.img ? 'icon' : 'icon missing');
    if (item && item.img) {
      const img = el('img');
      img.src = `${IMAGE_ROOT}${item.img}`;
      img.alt = item.name;
      img.loading = 'lazy';
      icon.append(img);
    } else {
      icon.textContent = '?';
    }
    if (reward.amount !== undefined) icon.append(el('span', 'qty', reward.amount.toLocaleString('en-US')));
    chip.append(icon, el('span', 'label', reward.name));
    if (reward.note) chip.title = reward.note;
    return chip;
  }

  function rewardList(rewards) {
    const list = el('div', 'rewards');
    rewards.forEach((reward) => list.append(rewardChip(reward)));
    return list;
  }

  function starCell(starChange) {
    if (starChange === undefined) return null;
    const direction = starChange > 0 ? 'up' : starChange < 0 ? 'down' : '';
    return el('span', `stars ${direction}`, `${starChange > 0 ? '+' : ''}${starChange} ★`);
  }

  function rankingTable(rankings, firstColumn) {
    const hasStars = rankings.some((r) => r.starChange !== undefined);
    const table = el('table');
    const headRow = table.createTHead().insertRow();
    [firstColumn, ...(hasStars ? ['Stars'] : []), 'Rewards'].forEach((label) => headRow.append(el('th', '', label)));
    const body = table.createTBody();
    rankings.forEach((ranking) => {
      const row = body.insertRow();
      row.insertCell().textContent = ranking.groupRanking;
      if (hasStars) {
        const cell = row.insertCell();
        const stars = starCell(ranking.starChange);
        if (stars) cell.append(stars);
      }
      row.insertCell().append(rewardList(ranking.rewards));
    });
    const wrap = el('div', 'scroll');
    wrap.append(table);
    return wrap;
  }

  function flatTierTable(tiers, alwaysShowScore = false) {
    const hasScore = alwaysShowScore || tiers.some((t) => t.scoreTotal !== undefined);
    const hasRewards = tiers.some((t) => t.rewards && t.rewards.length);
    const table = el('table');
    const headRow = table.createTHead().insertRow();
    ['Tier', ...(hasScore ? ['Score total'] : []), ...(hasRewards ? ['Rewards'] : [])].forEach((label) => headRow.append(el('th', '', label)));
    const body = table.createTBody();
    tiers.forEach((tier) => {
      const row = body.insertRow();
      row.insertCell().textContent = tier.name;
      if (tier.note) row.title = tier.note;
      if (hasScore) {
        const cell = row.insertCell();
        cell.className = 'num';
        cell.textContent = tier.scoreTotal === undefined ? 'TBD' : tier.scoreTotal.toLocaleString('en-US');
      }
      if (hasRewards) row.insertCell().append(rewardList(tier.rewards ?? []));
    });
    const wrap = el('div', 'scroll');
    wrap.append(table);
    return wrap;
  }

  function levelsTable(levels) {
    const table = el('table');
    const headRow = table.createTHead().insertRow();
    ['Level', 'Tier', 'Power', 'Bonus', 'Infantry', 'Lancer', 'Marksman', 'Total troops', 'Rewards'].forEach((label) => headRow.append(el('th', '', label)));
    const body = table.createTBody();
    levels.forEach((level) => {
      const row = body.insertRow();
      const numbers = [level.level, level.tier, level.power, level.bonus, level.troops.infantry, level.troops.lancer, level.troops.marksman, level.totalTroops];
      numbers.forEach((value) => {
        const cell = row.insertCell();
        cell.className = 'num';
        cell.textContent = value.toLocaleString('en-US');
      });
      const rewards = row.insertCell();
      rewards.append(rewardList(level.rewards));
      if (level.note) row.title = level.note;
    });
    const wrap = el('div', 'scroll');
    wrap.append(table);
    return wrap;
  }

  function levelsSection(tier) {
    const withLevels = tier.rankings.filter((r) => r.levels);
    const key = tier.name;
    const selected = activeLevelsByTier[key] ?? withLevels[0].groupRanking;
    const body = el('div');
    const pills = el('div', 'pills');
    withLevels.forEach((ranking) => {
      const pill = el('button', `pill${ranking.groupRanking === selected ? ' active' : ''}`, ranking.groupRanking);
      pill.addEventListener('click', () => { activeLevelsByTier[key] = ranking.groupRanking; renderEvent(); });
      pills.append(pill);
    });
    body.append(pills, levelsTable(withLevels.find((r) => r.groupRanking === selected).levels));
    return section(`${tier.name}: enemy levels`, body);
  }

  function tiersSection(event) {
    const tiers = event.tiers;
    const hasRankings = tiers.some((t) => t.rankings);
    if (!hasRankings) return section('Tiers', flatTierTable(tiers));

    const body = el('div');
    const selected = activeTierByEvent[event.id] ?? tiers[0].name;
    const pills = el('div', 'pills');
    tiers.forEach((tier) => {
      const pill = el('button', `pill${tier.name === selected ? ' active' : ''}`, tier.name);
      pill.addEventListener('click', () => { activeTierByEvent[event.id] = tier.name; renderEvent(); });
      pills.append(pill);
    });
    const tier = tiers.find((t) => t.name === selected);
    body.append(pills);
    if (tier.scoreTotal !== undefined) {
      body.append(el('p', 'sub', `Minimum score: ${tier.scoreTotal.toLocaleString('en-US')}`));
    }
    if (tier.rewards && tier.rewards.length) body.append(rewardList(tier.rewards));
    body.append(rankingTable(tier.rankings, 'Placement'));
    if (tier.rankings.some((r) => r.levels)) body.append(levelsSection(tier));
    return section('Tiers (lowest to highest)', body);
  }

  function shopTable(shop, event) {
    const table = el('table');
    const headRow = table.createTHead().insertRow();
    ['Offer', event.shopCurrencyItemId && ITEMS[event.shopCurrencyItemId] ? `Cost (${ITEMS[event.shopCurrencyItemId].name})` : event.shopCurrencyName ? `Cost (${event.shopCurrencyName})` : 'Cost', 'Limit'].forEach((label) => headRow.append(el('th', '', label)));
    const body = table.createTBody();
    shop.forEach((offer) => {
      const row = body.insertRow();
      const offerCell = row.insertCell();
      if (offer.contents) { offerCell.append(el('b', '', offer.reward.name), rewardList(offer.contents)); } else { offerCell.append(rewardList([offer.reward])); }
      const cost = row.insertCell();
      cost.className = 'num';
      cost.textContent = offer.cost.toLocaleString('en-US');
      const limit = row.insertCell();
      limit.className = 'num';
      limit.textContent = offer.limit;
    });
    const wrap = el('div', 'scroll');
    wrap.append(table);
    return wrap;
  }

  function zonesTable(zones) {
    const table = el('table');
    const headRow = table.createTHead().insertRow();
    ['Zone', 'Open', 'Stats from', 'Unlock', 'Stages'].forEach((label) => headRow.append(el('th', '', label)));
    const body = table.createTBody();
    zones.forEach((zone) => {
      const row = body.insertRow();
      row.insertCell().textContent = zone.name;
      row.insertCell().textContent = zone.days.join(', ');
      row.insertCell().textContent = zone.statSources;
      row.insertCell().textContent = zone.unlock ?? '';
      const stages = row.insertCell();
      stages.className = 'num';
      stages.textContent = zone.stages === undefined ? '' : zone.stages.toLocaleString('en-US');
      if (zone.note) row.title = zone.note;
    });
    const wrap = el('div', 'scroll');
    wrap.append(table);
    return wrap;
  }

  function refreshesTable(refreshes) {
    const qualities = [...new Set(refreshes.flatMap((r) => Object.keys(r.chances)))];
    const table = el('table');
    const headRow = table.createTHead().insertRow();
    ['Refresh', 'Gem cost', ...qualities.map((q) => `${q} chance`)].forEach((label) => headRow.append(el('th', '', label)));
    const body = table.createTBody();
    refreshes.forEach((refresh) => {
      const row = body.insertRow();
      row.insertCell().textContent = refresh.refresh;
      const cost = row.insertCell();
      cost.className = 'num';
      cost.textContent = refresh.gemCost === undefined ? '' : refresh.gemCost.toLocaleString('en-US');
      qualities.forEach((q) => {
        const cell = row.insertCell();
        cell.className = 'num';
        cell.textContent = refresh.chances[q] === undefined ? '' : `${refresh.chances[q]}%`;
      });
    });
    const wrap = el('div', 'scroll');
    wrap.append(table);
    return wrap;
  }

  function heroByGenerationTable(rows) {
    const table = el('table');
    const headRow = table.createTHead().insertRow();
    ['Generation', 'Hero', 'Shard'].forEach((label) => headRow.append(el('th', '', label)));
    const body = table.createTBody();
    rows.forEach((row) => {
      const tr = body.insertRow();
      tr.insertCell().textContent = row.generation;
      const hero = HEROES[row.heroId];
      tr.insertCell().textContent = hero ? hero.name : row.heroId;
      const cell = tr.insertCell();
      if (row.shardItemId && ITEMS[row.shardItemId]) cell.append(rewardList([{ name: ITEMS[row.shardItemId].name, itemId: row.shardItemId }]));
    });
    const wrap = el('div', 'scroll');
    wrap.append(table);
    return wrap;
  }

  function missionsTable(missions, pointsLabel = 'Base points') {
    const table = el('table');
    const headRow = table.createTHead().insertRow();
    ['Mission', pointsLabel, ...(missions.some((m) => m.levels) ? ['Levels'] : []), ...(missions.some((m) => m.levelRequirements) ? ['Level requirements'] : []), ...(missions.some((m) => m.rewards) ? ['Other rewards'] : [])].forEach((label) => headRow.append(el('th', '', label)));
    const body = table.createTBody();
    let lastGroup;
    missions.forEach((mission) => {
      if (mission.group !== lastGroup) {
        const groupRow = body.insertRow();
        const cell = groupRow.insertCell();
        cell.colSpan = headRow.cells.length;
        cell.append(el('b', '', mission.group));
        lastGroup = mission.group;
      }
      const row = body.insertRow();
      row.insertCell().textContent = mission.name;
      const points = row.insertCell();
      points.className = 'num';
      points.textContent = mission.points.toLocaleString('en-US');
      if (missions.some((m) => m.levels)) row.insertCell().textContent = mission.levels ?? '';
      if (missions.some((m) => m.levelRequirements)) {
        const requirements = row.insertCell();
        (mission.levelRequirements ?? []).forEach((l) => requirements.append(el('div', '', `Level ${l.level}: ${l.requirement ?? 'TBD'}`)));
        if (mission.note) requirements.title = mission.note;
      }
      if (missions.some((m) => m.rewards)) row.insertCell().append(rewardList(mission.rewards ?? []));
    });
    const wrap = el('div', 'scroll');
    wrap.append(table);
    return wrap;
  }

  function dayContent(day) {
    const body = el('div');
    const victory = day.victoryPoints === undefined ? '' : `${day.victoryPoints} victory point${day.victoryPoints === 1 ? '' : 's'} for the winner`;
    if (victory) body.append(el('p', 'sub', victory));
    if (day.note) body.append(el('p', 'sub', day.note));
    body.append(el('p', 'sub', 'Points to score'));
    const scoring = el('table');
    const headRow = scoring.createTHead().insertRow();
    ['Action', 'Points'].forEach((label) => headRow.append(el('th', '', label)));
    const scoringBody = scoring.createTBody();
    day.scoring.forEach((entry) => {
      const row = scoringBody.insertRow();
      row.insertCell().textContent = entry.action;
      const points = row.insertCell();
      points.className = 'num';
      points.textContent = entry.points.toLocaleString('en-US');
    });
    const scoringWrap = el('div', 'scroll');
    scoringWrap.append(scoring);
    body.append(scoringWrap);
    if (day.milestones) {
      body.append(el('p', 'sub', (/^\d/.test(day.day) ? 'Personal point milestones and rewards' : 'Target point levels and rewards')));
      body.append(flatTierTable(day.milestones, true));
    }
    if (day.allianceMilestones) {
      body.append(el('p', 'sub', 'Alliance point milestones and rewards'));
      body.append(flatTierTable(day.allianceMilestones, true));
    }
    return body;
  }

  function daysSection(event) {
    const selected = activeDayByEvent[event.id] ?? event.days[0].day;
    const body = el('div');
    const pills = el('div', 'pills');
    event.days.forEach((day) => {
      const pill = el('button', `pill${day.day === selected ? ' active' : ''}`, (/^\d/.test(day.day) ? `Day ${day.day}: ${day.name}` : day.name));
      pill.addEventListener('click', () => { activeDayByEvent[event.id] = day.day; renderEvent(); });
      pills.append(pill);
    });
    body.append(pills, dayContent(event.days.find((day) => day.day === selected)));
    return section(event.days.every((day) => /^\d/.test(day.day)) ? 'Days' : 'Versions', body);
  }

  function pointLevelsTable(pointLevels) {
    const table = el('table');
    const headRow = table.createTHead().insertRow();
    ['Level', 'Personal points', 'Alliance points', 'Rewards'].forEach((label) => headRow.append(el('th', '', label)));
    const body = table.createTBody();
    const pointCell = (row, icon, value) => {
      const cell = row.insertCell();
      cell.className = 'num';
      const img = el('img');
      img.src = `${IMAGE_ROOT}${icon}`;
      img.alt = '';
      img.style.cssText = 'width:20px;height:20px;vertical-align:middle;margin-right:6px;';
      cell.append(img, document.createTextNode(value.toLocaleString('en-US')));
    };
    pointLevels.levels.forEach((level) => {
      const row = body.insertRow();
      row.insertCell().textContent = level.level;
      pointCell(row, pointLevels.personalIcon, level.personalPoints);
      pointCell(row, pointLevels.allianceIcon, level.alliancePoints);
      row.insertCell().append(rewardList(level.rewards));
    });
    const wrap = el('div', 'scroll');
    wrap.append(table);
    return wrap;
  }

  const TARGET_LABELS = { city: 'Player cities', headquarters: 'Alliance HQ' };

  function wavesTable(waves) {
    const table = el('table');
    const headRow = table.createTHead().insertRow();
    ['Wave', 'Target', 'Rule', 'Details'].forEach((label) => headRow.append(el('th', '', label)));
    const body = table.createTBody();
    waves.forEach((wave) => {
      const row = body.insertRow();
      row.insertCell().textContent = wave.wave;
      row.insertCell().textContent = TARGET_LABELS[wave.target];
      row.insertCell().textContent = wave.rule;
      row.insertCell().textContent = wave.details ?? '';
    });
    const wrap = el('div', 'scroll');
    wrap.append(table);
    return wrap;
  }

  function renderEvent() {
    eventEl.replaceChildren();
    const event = EVENTS.find((e) => e.id === activeEventId);
    if (!event) {
      eventEl.append(el('p', 'empty', 'No events in this category yet.'));
      return;
    }
    const card = el('div', 'card');
    const head = el('div', 'event-head');
    const icon = el('img');
    icon.src = `${IMAGE_ROOT}${event.img}`;
    icon.alt = event.name;
    const titleWrap = el('div');
    titleWrap.append(el('h3', '', event.name));
    const chips = el('div', 'chips');
    if (event.frequency) chips.append(el('span', 'chip', `Frequency: ${event.frequency}`));
    if (event.duration) chips.append(el('span', 'chip', `Duration: ${event.duration}`));
    titleWrap.append(chips);
    head.append(icon, titleWrap);
    card.append(head, el('p', 'description', event.description));

    if (event.requirements) card.append(section('Requirements', bulletList(event.requirements)));
    if (event.phases) {
      const phases = el('div', 'phases');
      event.phases.forEach((phase) => {
        const box = el('div', 'phase');
        box.append(el('b', '', phase.name));
        if (phase.description) box.append(el('span', '', phase.description));
        phases.append(box);
      });
      card.append(section('Phases', phases));
    }
    if (event.waves) card.append(section('Waves', wavesTable(event.waves)));
    if (event.pointLevels) card.append(section('Defense point levels', pointLevelsTable(event.pointLevels)));
    if (event.days) card.append(daysSection(event));
    if (event.zones) card.append(section('Zones', zonesTable(event.zones)));
    if (event.heroByGeneration) card.append(section('Hero by generation', heroByGenerationTable(event.heroByGeneration)));
    if (event.refreshes) card.append(section('Refreshes', refreshesTable(event.refreshes)));
    if (event.shop) card.append(section('Shop', shopTable(event.shop, event)));
    (event.shops ?? []).forEach((shop) => card.append(section(shop.name, shopTable(shop.offers, event))));
    if (event.missions) card.append(section('Missions', missionsTable(event.missions, event.missionPointsLabel)));
    if (event.tiers) card.append(tiersSection(event));
    if (event.allianceRankings) card.append(section(event.allianceRankingUpdates ? 'Alliance rewards (first list)' : 'Alliance rewards', rankingTable(event.allianceRankings, 'Alliance rank')));
    if (event.allianceRankingUpdates) event.allianceRankingUpdates.forEach((update) => {
      const body = el('div');
      if (update.note) body.append(el('p', 'sub', update.note));
      body.append(rankingTable(update.rankings, 'Alliance rank'));
      card.append(section(`Alliance rewards (${update.name.toLowerCase()})`, body));
    });
    if (event.personalRankings) event.personalRankings.forEach((table) => card.append(section(`Personal rewards by ${table.basedOn.toLowerCase()}`, rankingTable(table.rankings, 'Rank'))));
    if (event.rewards && event.rewards.length) card.append(section('Other rewards', rewardList(event.rewards)));
    if (event.tips) card.append(section('Tips', bulletList(event.tips)));
    eventEl.append(card);
  }

  function renderTabs() {
    tabsEl.replaceChildren();
    EVENTS.forEach((event) => {
      const tab = el('button', `tab${event.id === activeEventId ? ' active' : ''}`);
      const img = el('img');
      img.src = `${IMAGE_ROOT}${event.img}`;
      img.alt = '';
      tab.append(img, document.createTextNode(event.name));
      tab.addEventListener('click', () => { activeEventId = event.id; renderTabs(); renderEvent(); });
      tabsEl.append(tab);
    });
  }

  renderTabs();
  renderEvent();
</script>
</body>
</html>
