<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>King of Icefield Calculator</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #16202c;
    --panel-border: #26374a;
    --text: #e6edf5;
    --text-dim: #8fa1b3;
    --accent: #4fc3f7;
    --row-alt: #131d27;
    --good: #52d17a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 60px;
    max-width: 980px;
  }
  a { color: var(--accent); }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 0.85rem; margin: 24px 0 8px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  p.sub { color: var(--text-dim); margin: 0 0 18px; font-size: 0.85rem; line-height: 1.45; }
  .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .controls label { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; }
  select, input[type="number"] {
    background: #0f1720;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 0.9rem;
  }
  input[type="number"] { width: 110px; text-align: right; }
  select:disabled { opacity: 0.45; }
  button {
    background: #0f1720;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .bonus-note { color: var(--good); font-size: 0.85rem; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 10px; }
  .pill {
    background: #0f1720;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 4px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .pill.active { background: var(--accent); color: #06222e; border-color: var(--accent); font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--panel-border); text-align: left; vertical-align: middle; }
  th { color: var(--text-dim); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tbody tr:nth-child(even) td { background: var(--row-alt); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--panel-border); }
  td.bonus { color: var(--good); }
  .scroll { overflow-x: auto; }
  .note { color: var(--text-dim); font-size: 0.8rem; margin: 8px 0 0; line-height: 1.4; }
</style>
</head>
<body>
  <p><a href="index.html">&larr; All sample pages</a></p>
  <h1 id="page-title"></h1>
  <p class="sub" id="page-intro"></p>

  <div class="card" id="bonus-card">
    <div class="controls">
      <label><input type="checkbox" id="bonus-on" /> <span id="bonus-label"></span></label>
      <label>Skill level
        <select id="bonus-level" disabled></select>
      </label>
      <span class="bonus-note" id="bonus-note"></span>
      <button type="button" id="reset">Reset all numbers</button>
    </div>
    <p class="note" id="bonus-help"></p>
  </div>
  <div class="card" id="reset-card"><div class="controls"><button type="button" id="reset-only">Reset all numbers</button></div></div>

  <div class="pills" id="pills"></div>
  <div class="card" id="day-card"></div>

  <h2 id="summary-title">Totals</h2>
  <div class="card scroll" id="event-card"></div>

<script id="calc-data" type="application/json">{"config":{"title":"King of Icefield Calculator","intro":"Enter how many times you do each action on each day of King of Icefield. The page adds up your points per day and for the whole event. No expert changes these points. Nothing is saved, and reloading the page clears your numbers.","bonus":null,"groups":[],"showEventTotal":true},"days":[{"day":"1","name":"City Construction","note":"The wiki image of this day cuts off after the charm row, so later rows may be missing. Chief Charm score for each level up: Lv. 1 625, Lv. 2 1,250, Lv. 3 3,125, Lv. 4 8,750, Lv. 5 11,250, Lv. 6 12,500, Lv. 7 12,500, Lv. 8 13,000, Lv. 9 14,000, Lv. 10 15,000, Lv. 11 16,000, Lv. 12 17,000, Lv. 13 18,000, Lv. 14 19,000, Lv. 15 20,000, Lv. 16 21,000.","scoring":[{"action":"Use 1 Fire Crystal to upgrade buildings","points":2000},{"action":"Use 1 Fire Crystal Shard for Research","points":1000},{"action":"Use 1 Refined Fire Crystal to upgrade buildings","points":30000},{"action":"Use 1m of Speedups for Construction","points":30},{"action":"Use 1m of Speedups for Research","points":30},{"action":"Use 1m of Speedups for Training (Training, Promotion)","points":30},{"action":"Raise Chief Charm max score by 1","points":70}]},{"day":"2","name":"Hero Development","note":"","scoring":[{"action":"Use 1 Fire Crystal to upgrade buildings","points":2000},{"action":"Use 1 Fire Crystal Shard for Research","points":1000},{"action":"Use 1 Refined Fire Crystal to upgrade buildings","points":30000},{"action":"Use 1m of Speedups for Construction","points":30},{"action":"Use 1m of Speedups for Research","points":30},{"action":"Use 1m of Speedups for Training (Training, Promotion)","points":30},{"action":"Play Lucky Wheel 1 time","points":8000},{"action":"Use 1 Rare Hero Shard to ascend Heroes","points":350},{"action":"Use 1 Epic Hero Shard to ascend Heroes","points":1220},{"action":"Use 1 Mythic Hero Shard to ascend Heroes","points":3040},{"action":"Use 1 Hero Gear Essence Stone","points":4000},{"action":"Use 1 Widget of any Hero Exclusive Gear","points":8000},{"action":"Use 1 Mithril","points":40000}]},{"day":"3","name":"Basic Skills Up","note":"The wiki shows only the rows in the screenshots, so later rows may be missing. Pet advancement score when you advance a pet: Lv. 40 3,000, Lv. 50 4,500, Lv. 60 6,750, Lv. 70 10,000, Lv. 80 12,000, Lv. 90 14,500, Lv. 100 17,500. The row for Lv. 30 is cut off in the source image. Chief Charm score for each level up: Lv. 1 625, Lv. 2 1,250, Lv. 3 3,125, Lv. 4 8,750, Lv. 5 11,250, Lv. 6 12,500, Lv. 7 12,500, Lv. 8 13,000, Lv. 9 14,000, Lv. 10 15,000, Lv. 11 16,000, Lv. 12 17,000, Lv. 13 18,000, Lv. 14 19,000, Lv. 15 20,000, Lv. 16 21,000.","scoring":[{"action":"Pet advancement score increases by 1","points":50},{"action":"Use 1 Advanced Wild Mark to refine pets","points":15000},{"action":"Use 1 Common Wild Mark to refine pets","points":1150},{"action":"Raise Chief Charm max score by 1","points":70},{"action":"Play Lucky Wheel 1 time","points":8000},{"action":"Use 1 Rare Hero Shard to ascend Heroes","points":350},{"action":"Use 1 Epic Hero Shard to ascend Heroes","points":1220},{"action":"Use 1 Mythic Hero Shard to ascend Heroes","points":3040}]},{"day":"4","name":"Combat Training","note":"Points earned from promotion are the difference in points between training troops of the corresponding levels. Chief Charm score for each level up: Lv. 1 625, Lv. 2 1,250, Lv. 3 3,125, Lv. 4 8,750, Lv. 5 11,250, Lv. 6 12,500, Lv. 7 12,500, Lv. 8 13,000, Lv. 9 14,000, Lv. 10 15,000, Lv. 11 16,000, Lv. 12 17,000, Lv. 13 18,000, Lv. 14 19,000, Lv. 15 20,000, Lv. 16 21,000.","scoring":[{"action":"Raise Chief Charm max score by 1","points":70},{"action":"Use 1 Hero Gear Essence Stone","points":4000},{"action":"Use 1 Widget of any Hero Exclusive Gear","points":8000},{"action":"Use 1 Mithril","points":40000},{"action":"Train 1 Lv. 1 Troop","points":1},{"action":"Train 1 Lv. 2 Troop","points":2},{"action":"Train 1 Lv. 3 Troop","points":3},{"action":"Train 1 Lv. 4 Troop","points":5},{"action":"Train 1 Lv. 5 Troop","points":7},{"action":"Train 1 Lv. 6 Troop","points":11},{"action":"Train 1 Lv. 7 Troop","points":16},{"action":"Train 1 Lv. 8 Troop","points":23},{"action":"Train 1 Lv. 9 Troop","points":30},{"action":"Train 1 Lv. 10 Troop","points":39},{"action":"Train 1 Lv. 11 Troop","points":49}]},{"day":"5","name":"Basic Skills Up","note":"","scoring":[{"action":"Use 1 Fire Crystal to upgrade buildings","points":2000},{"action":"Use 1 Fire Crystal Shard for Research","points":1000},{"action":"Use 1 Refined Fire Crystal to upgrade buildings","points":30000},{"action":"Use 1m of Speedups for Construction","points":30},{"action":"Use 1m of Speedups for Research","points":30},{"action":"Use 1m of Speedups for Training (Training, Promotion)","points":30},{"action":"Use 1 Hero Gear Essence Stone","points":4000},{"action":"Use 1 Widget of any Hero Exclusive Gear","points":8000},{"action":"Use 1 Mithril","points":40000}]},{"day":"6","name":"Combat Training","note":"Only the rows from Lv. 6 troops down are shown on the wiki, so the rows above them are not loaded. Chief Gear score for each level up: Uncommon 1,125, Uncommon 1-star 1,875, Rare 3,000, Rare 1-star 4,500, Rare 2-star 5,100, Rare 3-star 5,440, Epic and Epic 1-star 3,230, Epic 2-star and 3-star 3,225, Epic T1 and T1 1-star 3,440, Epic T1 2-star and 3-star 4,085, every Mythic gear up to T2 3-star 6,250, and every Legendary gear up to T3 3-star 9,560. The rows for Epic T2 and Epic T3 are cut off in the source images. Legendary gear is available around day 180 of a server.","scoring":[{"action":"Train 1 Lv. 6 Troop","points":11},{"action":"Train 1 Lv. 7 Troop","points":16},{"action":"Train 1 Lv. 8 Troop","points":23},{"action":"Train 1 Lv. 9 Troop","points":30},{"action":"Train 1 Lv. 10 Troop","points":39},{"action":"Train 1 Lv. 11 Troop","points":49}]},{"day":"7","name":"Hero Development","note":"Pet advancement score when you advance a pet: Lv. 40 3,000, Lv. 50 4,500, Lv. 60 6,750, Lv. 70 10,000, Lv. 80 12,000, Lv. 90 14,500, Lv. 100 17,500. The row for Lv. 30 is cut off in the source image.","scoring":[{"action":"Pet advancement score increases by 1","points":50},{"action":"Use 1 Advanced Wild Mark to refine pets","points":15000},{"action":"Use 1 Common Wild Mark to refine pets","points":1150},{"action":"Use 1 Fire Crystal to upgrade buildings","points":2000},{"action":"Use 1 Fire Crystal Shard for Research","points":1000},{"action":"Use 1 Refined Fire Crystal to upgrade buildings","points":30000},{"action":"Use 1m of Speedups for Construction","points":30},{"action":"Use 1m of Speedups for Research","points":30},{"action":"Use 1m of Speedups for Training (Training, Promotion)","points":30},{"action":"Raise Chief Gear max score by 1","points":36},{"action":"Gather 2,000 Meat in the Wilderness","points":3},{"action":"Gather 2,000 Wood in the Wilderness","points":3},{"action":"Gather 400 Coal in the Wilderness","points":3},{"action":"Gather 100 Iron in the Wilderness","points":3},{"action":"Use 1 Rare Hero Shard to ascend Heroes","points":350},{"action":"Use 1 Epic Hero Shard to ascend Heroes","points":1220},{"action":"Use 1 Mythic Hero Shard to ascend Heroes","points":3040}]}]}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('calc-data').textContent);
  const CONFIG = DATA.config;
  const usage = {};
  let activeDay = DATA.days[0].day;
  const fmt = (n) => n.toLocaleString('en-US');

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function bonusPercent() {
    if (!CONFIG.bonus || !document.getElementById('bonus-on').checked) return 0;
    return CONFIG.bonus.percents[Number(document.getElementById('bonus-level').value) - 1];
  }

  function bonusApplies(day, action) {
    const bonus = CONFIG.bonus;
    if (!bonus) return false;
    if (bonus.exceptDays.includes(day)) return false;
    return !(bonus.exceptActionPattern && new RegExp(bonus.exceptActionPattern).test(action));
  }

  function count(day, action) {
    return (usage[day] && usage[day][action]) || 0;
  }

  function sum(list) {
    const base = list.reduce((s, d) => s + d.base, 0);
    const bonus = list.reduce((s, d) => s + d.bonus, 0);
    return { base, bonus, total: base + bonus };
  }

  function calculate() {
    const percent = bonusPercent();
    const days = DATA.days.map((day) => {
      const lines = day.scoring.map((s) => ({ action: s.action, points: s.points, count: count(day.day, s.action), subtotal: s.points * count(day.day, s.action) }));
      const base = lines.reduce((s, l) => s + l.subtotal, 0);
      const bonusBase = lines.filter((l) => bonusApplies(day.day, l.action)).reduce((s, l) => s + l.subtotal, 0);
      const bonus = Math.round((bonusBase * percent) / 100);
      return { day: day.day, name: day.name, lines, base, bonus, total: base + bonus };
    });
    const groups = CONFIG.groups.map((g) => ({ label: g.label, score: sum(days.filter((d) => g.days.includes(d.day))) }));
    return { percent, days, groups, event: sum(days) };
  }

  function dayLabel(day) {
    return /^\d/.test(day.day) ? `Day ${day.day}: ${day.name}` : day.name;
  }

  function renderPills() {
    const pills = document.getElementById('pills');
    pills.replaceChildren();
    DATA.days.forEach((day) => {
      const pill = el('button', `pill${day.day === activeDay ? ' active' : ''}`, dayLabel(day));
      pill.type = 'button';
      pill.addEventListener('click', () => { activeDay = day.day; render(); });
      pills.append(pill);
    });
  }

  function renderDay(result) {
    const card = document.getElementById('day-card');
    card.replaceChildren();
    const day = result.days.find((d) => d.day === activeDay);
    const source = DATA.days.find((d) => d.day === activeDay);
    if (source.note) card.append(el('p', 'note', source.note));
    const wrap = el('div', 'scroll');
    const table = el('table');
    const head = table.createTHead().insertRow();
    [['Action', ''], ['Points each', 'num'], ['Times done', 'num'], ['Points', 'num']].forEach(([label, cls]) => head.append(el('th', cls, label)));
    const body = table.createTBody();
    day.lines.forEach((line) => {
      const row = body.insertRow();
      row.insertCell().textContent = line.action;
      row.insertCell().className = 'num';
      row.cells[1].textContent = fmt(line.points);
      const inputCell = row.insertCell();
      inputCell.className = 'num';
      const input = el('input');
      input.type = 'number';
      input.min = '0';
      input.step = '1';
      input.value = line.count === 0 ? '' : String(line.count);
      input.placeholder = '0';
      input.setAttribute('aria-label', line.action);
      const subtotal = row.insertCell();
      subtotal.className = 'num';
      subtotal.textContent = fmt(line.subtotal);
      input.addEventListener('input', () => {
        const value = Math.max(0, Math.floor(Number(input.value) || 0));
        usage[activeDay] = usage[activeDay] || {};
        usage[activeDay][line.action] = value;
        renderSummaries();
      });
      inputCell.append(input);
    });
    const totals = CONFIG.bonus
      ? [['Day total before the bonus', day.base, ''], ['Expert bonus', day.bonus, 'bonus'], ['Day total', day.total, 'total']]
      : [['Day total', day.total, 'total']];
    totals.forEach(([label, value, cls]) => {
      const row = body.insertRow();
      row.className = cls === 'total' ? 'total' : '';
      const labelCell = row.insertCell();
      labelCell.colSpan = 3;
      labelCell.textContent = label;
      const valueCell = row.insertCell();
      valueCell.className = `num ${cls === 'bonus' ? 'bonus' : ''}`;
      valueCell.textContent = fmt(value);
    });
    wrap.append(table);
    card.append(wrap);
  }

  function renderEvent(result) {
    const card = document.getElementById('event-card');
    card.replaceChildren();
    const table = el('table');
    const head = table.createTHead().insertRow();
    const headings = CONFIG.bonus ? [['Day', ''], ['Points before the bonus', 'num'], ['Expert bonus', 'num'], ['Total', 'num']] : [['Day', ''], ['Total', 'num']];
    headings.forEach(([label, cls]) => head.append(el('th', cls, label)));
    const body = table.createTBody();
    const addRow = (label, score, cls) => {
      const row = body.insertRow();
      if (cls) row.className = cls;
      row.insertCell().textContent = label;
      (CONFIG.bonus ? [score.base, score.bonus, score.total] : [score.total]).forEach((value, i) => {
        const cell = row.insertCell();
        cell.className = `num${CONFIG.bonus && i === 1 ? ' bonus' : ''}`;
        cell.textContent = fmt(value);
      });
    };
    result.days.forEach((day) => addRow(dayLabel(day), day));
    result.groups.forEach((g) => addRow(g.label, g.score, 'total'));
    if (CONFIG.showEventTotal) addRow('Whole event', result.event, 'total');
    card.append(table);
  }

  function renderSummaries() {
    const result = calculate();
    if (CONFIG.bonus) document.getElementById('bonus-note').textContent = result.percent > 0 ? `${CONFIG.bonus.expert} bonus: +${result.percent}%` : '';
    renderEvent(result);
    const current = result.days.find((d) => d.day === activeDay);
    const rows = document.getElementById('day-card').querySelectorAll('tbody tr');
    const lineCount = current.lines.length;
    current.lines.forEach((line, i) => { rows[i].cells[3].textContent = fmt(line.subtotal); });
    const totals = CONFIG.bonus ? [current.base, current.bonus, current.total] : [current.total];
    totals.forEach((value, i) => { rows[lineCount + i].cells[1].textContent = fmt(value); });
  }

  function render() {
    renderPills();
    renderDay(calculate());
    renderSummaries();
  }

  function resetAll() {
    Object.keys(usage).forEach((day) => delete usage[day]);
    render();
  }

  document.getElementById('page-title').textContent = CONFIG.title;
  document.getElementById('page-intro').textContent = CONFIG.intro;
  document.getElementById('summary-title').textContent = CONFIG.showEventTotal ? 'Whole event' : 'Totals';
  document.getElementById('reset-only').addEventListener('click', resetAll);
  const bonusCard = document.getElementById('bonus-card');
  if (CONFIG.bonus) {
    document.getElementById('reset-card').remove();
    document.getElementById('bonus-label').textContent = `Use ${CONFIG.bonus.expert} (${CONFIG.bonus.skill})`;
    document.getElementById('bonus-help').textContent = CONFIG.bonus.help;
    const levelSelect = document.getElementById('bonus-level');
    CONFIG.bonus.percents.forEach((percent, i) => {
      const option = el('option', '', `Level ${i + 1} (+${percent}%)`);
      option.value = String(i + 1);
      levelSelect.append(option);
    });
    levelSelect.value = String(CONFIG.bonus.percents.length);
    document.getElementById('bonus-on').addEventListener('change', (event) => { levelSelect.disabled = !event.target.checked; render(); });
    levelSelect.addEventListener('change', render);
    document.getElementById('reset').addEventListener('click', resetAll);
  } else {
    bonusCard.remove();
  }
  render();
})();
</script>
</body>
</html>
