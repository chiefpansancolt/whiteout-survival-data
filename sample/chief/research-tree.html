<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Research Tech Tree</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #16202c;
    --panel-border: #26374a;
    --text: #e6edf5;
    --text-dim: #8fa1b3;
    --accent: #4fc3f7;
    --gate: #c99fef;
    --hub: #ffb84f;
    --ghost: #5a6675;
    --line: #3a86c8;
    --node-bg: #1c2e42;
    --node-border: #2f4b68;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 60px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { color: var(--text-dim); margin: 0 0 18px; font-size: 0.85rem; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .tab.active {
    background: var(--accent);
    color: #06222e;
    border-color: var(--accent);
    font-weight: 600;
  }
  .meta { color: var(--text-dim); font-size: 0.82rem; margin-bottom: 16px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 0.78rem; color: var(--text-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
  .scroll-wrap {
    overflow: auto;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    background: var(--panel);
    padding: 24px;
  }
  .tree-canvas { position: relative; }
  .tree-canvas svg { position: absolute; top: 0; left: 0; overflow: visible; }
  .node {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 76px;
  }
  .node.up { flex-direction: column-reverse; }
  .node-tier {
    position: absolute;
    top: -6px;
    left: 2px;
    background: var(--accent);
    color: #06222e;
    font-size: 0.6rem;
    font-weight: 700;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    z-index: 2;
  }
  .node.up .node-tier { top: auto; bottom: -6px; }
  .node-icon {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    border: 2px solid var(--node-border);
    background: var(--node-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    z-index: 1;
  }
  .node-icon img { width: 100%; height: 100%; object-fit: cover; }
  .node-icon.hub { width: 60px; height: 60px; border-color: var(--hub); box-shadow: 0 0 14px rgba(255,184,79,0.6); }
  .node-ghost {
    width: 60px;
    height: 52px;
    border-radius: 12px;
    border: 2px dashed var(--ghost);
    background: transparent;
    color: var(--ghost);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 1.2rem;
  }
  .node-name {
    margin-top: 4px;
    font-size: 0.62rem;
    text-align: center;
    line-height: 1.15;
    color: var(--text);
    max-width: 76px;
  }
  .node-levels {
    margin-top: 2px;
    font-size: 0.6rem;
    color: var(--text-dim);
    background: #0f1720;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 1px 6px;
  }
  a { color: var(--accent); }
</style>

const { rankGap, nodeWidth, nodeHeight, labelHeight } = DATA.layout;
let active = DATA.tabs[0].id;

function edgePath(p1, p2, shape, fromUp, toUp, splitFraction) {
  if (shape === 'horizontal') {
    const x1 = p1.x + nodeWidth / 2;
    const x2 = p2.x - nodeWidth / 2;
    const midX = x1 + (x2 - x1) * (splitFraction === undefined ? 0.5 : splitFraction);
    return 'M ' + x1 + ' ' + p1.y + ' H ' + midX + ' V ' + p2.y + ' H ' + x2;
  }
  if (shape === 'up') {
    const y1 = p1.y - nodeHeight / 2 - (fromUp ? labelHeight : 0);
    const y2 = p2.y + nodeHeight / 2 + (toUp ? 0 : labelHeight);
    const midY = (y1 + y2) / 2;
    return 'M ' + p1.x + ' ' + y1 + ' V ' + midY + ' H ' + p2.x + ' V ' + y2;
  }
  const y1 = p1.y + nodeHeight / 2 + (fromUp ? 0 : labelHeight);
  const y2 = p2.y - nodeHeight / 2;
  const midY = (y1 + y2) / 2;
  return 'M ' + p1.x + ' ' + y1 + ' V ' + midY + ' H ' + p2.x + ' V ' + y2;
}

function renderNode(canvas, node) {
  const info = node.kind === 'hub' ? { name: DATA.hub.name, img: DATA.hub.img } : DATA.nodes[node.id];
  const nodeEl = document.createElement('div');
  nodeEl.className = 'node' + (node.labelAbove ? ' up' : '');
  nodeEl.style.left = (node.x - nodeWidth / 2) + 'px';
  nodeEl.style.top = (node.labelAbove ? node.y - nodeHeight / 2 - labelHeight : node.y - nodeHeight / 2) + 'px';
  nodeEl.title = node.kind === 'hub'
    ? info.name
    : info.name + '\n' + info.levelCount + ' level' + (info.levelCount === 1 ? '' : 's') + (info.img ? '' : '\n(no icon published yet)');

  if (node.kind === 'research') {
    const tierEl = document.createElement('div');
    tierEl.className = 'node-tier';
    tierEl.textContent = 'T' + info.tier;
    nodeEl.appendChild(tierEl);
  }

  const iconEl = document.createElement('div');
  iconEl.className = 'node-icon' + (node.kind === 'hub' ? ' hub' : '');
  if (info.img) {
    const img = document.createElement('img');
    img.src = '../..' + info.img;
    img.alt = info.name;
    img.loading = 'lazy';
    iconEl.appendChild(img);
  } else {
    iconEl.style.borderStyle = 'dashed';
    iconEl.style.borderColor = 'var(--ghost)';
    iconEl.textContent = '?';
    iconEl.style.color = 'var(--ghost)';
    iconEl.style.fontSize = '1.2rem';
  }
  nodeEl.appendChild(iconEl);

  const nameEl = document.createElement('div');
  nameEl.className = 'node-name';
  nameEl.textContent = info.name;
  nodeEl.appendChild(nameEl);

  if (node.kind === 'research') {
    const levelsEl = document.createElement('div');
    levelsEl.className = 'node-levels';
    levelsEl.textContent = 'Lv 1–' + info.levelCount;
    nodeEl.appendChild(levelsEl);
  }
  canvas.appendChild(nodeEl);
}

function renderTab(tab) {
  const canvas = document.getElementById('canvas');
  canvas.style.width = tab.width + 'px';
  canvas.style.height = tab.height + 'px';
  canvas.innerHTML = '';

  const byId = new Map(tab.nodes.map((n) => [n.id, n]));
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', tab.width);
  svg.setAttribute('height', tab.height);
  tab.edges.forEach((edge) => {
    const from = byId.get(edge.from);
    const to = byId.get(edge.to);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', edgePath(from, to, edge.shape, from.labelAbove, to.labelAbove, edge.splitFraction));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#3a86c8');
    path.setAttribute('stroke-width', '2');
    svg.appendChild(path);
  });
  canvas.appendChild(svg);
  tab.nodes.forEach((node) => renderNode(canvas, node));
}

function render() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  DATA.tabs.forEach((tab) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (tab.id === active ? ' active' : '');
    btn.textContent = tab.name;
    btn.onclick = () => { active = tab.id; render(); };
    tabsEl.appendChild(btn);
  });

  const tab = DATA.tabs.find((t) => t.id === active);
  document.getElementById('meta').textContent = tab.nodes.length + ' nodes, ' + tab.edges.length + ' links';
  const hasHub = tab.nodes.some((n) => n.kind === 'hub');
  document.getElementById('legend').innerHTML =
    '<span><i style="background:var(--node-bg);border:2px solid var(--node-border)"></i>Research node</span>' +
    (hasHub ? '<span><i style="background:var(--node-bg);border:2px solid var(--hub)"></i>Fire Crystal Shard (shared visual root)</span>' : '');
  renderTab(tab);
}

render();
