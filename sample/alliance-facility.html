<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alliance Facility Map</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #16202c;
    --panel-border: #26374a;
    --text: #e6edf5;
    --text-dim: #8fa1b3;
    --accent: #4fc3f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px 16px 24px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { color: var(--text-dim); margin: 0 0 12px; font-size: 0.85rem; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 20px;
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 12px;
  }
  .legend label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
  .legend .count { color: var(--text-dim); font-size: 0.8rem; }
  .swatch { width: 12px; height: 12px; flex: none; }
  .swatch.circle { border-radius: 50%; }
  .swatch.diamond { transform: rotate(45deg) scale(0.85); }
  .swatch.star { clip-path: polygon(50% 0, 62% 35%, 100% 38%, 70% 60%, 80% 100%, 50% 76%, 20% 100%, 30% 60%, 0 38%, 38% 35%); width: 16px; height: 16px; }
  svg {
    display: block;
    width: min(100%, calc(100vh - 150px));
    height: auto;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
  }
  .grid line { stroke: var(--panel-border); stroke-width: 1; }
  .axis { fill: var(--text-dim); font-size: 22px; }
  .marker text { fill: #0f1720; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .marker .shape { stroke: var(--bg); stroke-width: 3; }
  .marker:hover .shape { stroke: var(--text); }
</style>
</head>
<body>
<h1>Alliance Facility Map</h1>
<p class="sub">Hover a marker for its coordinates. Facilities show their level; strongholds and fortresses show their number and phase rewards.</p>

<div class="legend" id="legend"></div>
<svg id="map" viewBox="-60 -60 1320 1320" role="img" aria-label="Alliance facility locations"></svg>

reward":"Hero Gear XP"},{"phase":7,"reward":"Pet Stone"},{"phase":8,"reward":"Damage Buff"}]},{"id":"fortress-8","name":"Fortress 8","kind":"fortress","x":957,"y":606,"rewards":[{"phase":1,"reward":"Damage Buff"},{"phase":2,"reward":"Speedups"},{"phase":3,"reward":"Advanced Teleport"},{"phase":4,"reward":"Hero Gear XP"},{"phase":5,"reward":"Advanced Teleport"},{"phase":6,"reward":"Speedups"},{"phase":7,"reward":"Hero Gear XP"},{"phase":8,"reward":"Pet Stone"}]},{"id":"fortress-9","name":"Fortress 9","kind":"fortress","x":957,"y":828,"rewards":[{"phase":1,"reward":"Shards"},{"phase":2,"reward":"Deployment"},{"phase":3,"reward":"Speedups"},{"phase":4,"reward":"Damage Buff"},{"phase":5,"reward":"Pet Stone"},{"phase":6,"reward":"Deployment"},{"phase":7,"reward":"Speedups"},{"phase":8,"reward":"Hero Gear XP"}]},{"id":"fortress-10","name":"Fortress 10","kind":"fortress","x":846,"y":957,"rewards":[{"phase":1,"reward":"Advanced Teleport"},{"phase":2,"reward":"Shards"},{"phase":3,"reward":"Deployment"},{"phase":4,"reward":"Expedition Manual"},{"phase":5,"reward":"Hero Gear XP"},{"phase":6,"reward":"Pet Stone"},{"phase":7,"reward":"Deployment"},{"phase":8,"reward":"Speedups"}]},{"id":"fortress-11","name":"Fortress 11","kind":"fortress","x":606,"y":957,"rewards":[{"phase":1,"reward":"Speedups"},{"phase":2,"reward":"Advanced Teleport"},{"phase":3,"reward":"Shards"},{"phase":4,"reward":"Expedition Manual"},{"phase":5,"reward":"Speedups"},{"phase":6,"reward":"Hero Gear XP"},{"phase":7,"reward":"Pet Stone"},{"phase":8,"reward":"Deployment"}]},{"id":"fortress-12","name":"Fortress 12","kind":"fortress","x":366,"y":957,"rewards":[{"phase":1,"reward":"Deployment"},{"phase":2,"reward":"Speedups"},{"phase":3,"reward":"Advanced Teleport"},{"phase":4,"reward":"Speedups"},{"phase":5,"reward":"Advanced Teleport"},{"phase":6,"reward":"Speedups"},{"phase":7,"reward":"Hero Gear XP"},{"phase":8,"reward":"Pet Stone"}]}]</script>
<script>
  const FACILITIES = JSON.parse(document.getElementById('facility-data').textContent);
  const FORTRESSES = JSON.parse(document.getElementById('fortress-data').textContent);
  const MAP_SIZE = 1200;
  const GRID_STEP = 200;
  const MARKER_RADIUS = 32;
  const FACILITY_COLORS = {
    construction: '#f6b94c',
    defense: '#4fc3f7',
    expedition: '#ff7a8a',
    gathering: '#52d17a',
    production: '#c58bf2',
    tech: '#7aa2ff',
    training: '#ff9f5a',
    weapons: '#e0e0e0',
  };
  const FORTRESS_KINDS = [
    { kind: 'castle', label: 'Castle', color: '#ffeb3b', shape: 'star' },
    { kind: 'stronghold', label: 'Strongholds', color: '#26e0c8', shape: 'square' },
    { kind: 'fortress', label: 'Fortresses', color: '#ffffff', shape: 'diamond' },
  ];
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const map = document.getElementById('map');
  const legend = document.getElementById('legend');
  const layers = {};

  function svgElement(name, attributes) {
    const element = document.createElementNS(SVG_NS, name);
    for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
    return element;
  }

  function starPoints(radius) {
    const points = [];
    for (let i = 0; i < 10; i++) {
      const length = i % 2 === 0 ? radius : radius * 0.45;
      const angle = (Math.PI / 5) * i - Math.PI / 2;
      points.push(`${(Math.cos(angle) * length).toFixed(1)},${(Math.sin(angle) * length).toFixed(1)}`);
    }
    return points.join(' ');
  }

  function shapeElement(shape, color) {
    const r = MARKER_RADIUS;
    const attributes = { class: 'shape', fill: color };
    if (shape === 'circle') return svgElement('circle', { ...attributes, r });
    if (shape === 'square') return svgElement('rect', { ...attributes, x: -r, y: -r, width: r * 2, height: r * 2, rx: 4 });
    if (shape === 'diamond') return svgElement('polygon', { ...attributes, points: `0,${-r * 1.3} ${r * 1.3},0 0,${r * 1.3} ${-r * 1.3},0` });
    return svgElement('polygon', { ...attributes, points: starPoints(r * 1.9) });
  }

  function drawMarker({ x, y, shape, color, text, tooltip }) {
    const marker = svgElement('g', { class: 'marker', transform: `translate(${x} ${y})` });
    const title = svgElement('title', {});
    title.textContent = tooltip;
    const label = svgElement('text', {});
    label.textContent = text;
    marker.append(title, shapeElement(shape, color), label);
    return marker;
  }

  function drawGrid() {
    const grid = svgElement('g', { class: 'grid' });
    for (let v = 0; v <= MAP_SIZE; v += GRID_STEP) {
      grid.append(svgElement('line', { x1: v, y1: 0, x2: v, y2: MAP_SIZE }));
      grid.append(svgElement('line', { x1: 0, y1: v, x2: MAP_SIZE, y2: v }));
      const xLabel = svgElement('text', { class: 'axis', x: v, y: -18, 'text-anchor': 'middle' });
      xLabel.textContent = v;
      const yLabel = svgElement('text', { class: 'axis', x: -14, y: v, 'text-anchor': 'end', 'dominant-baseline': 'central' });
      yLabel.textContent = v;
      grid.append(xLabel, yLabel);
    }
    map.append(grid);
  }

  function drawFacilityLayer(facility) {
    const layer = svgElement('g', {});
    for (const level of facility.levels) {
      for (const { x, y } of level.locations) {
        layer.append(drawMarker({
          x, y,
          shape: 'circle',
          color: FACILITY_COLORS[facility.id],
          text: level.level,
          tooltip: `${facility.name} Lv.${level.level} (${x}, ${y})`,
        }));
      }
    }
    layers[facility.id] = layer;
    map.append(layer);
  }

  function rewardLines(structure) {
    return structure.rewards.map(({ phase, reward }) => `Phase ${phase}: ${reward}`).join('\n');
  }

  function drawFortressLayer({ kind, color, shape }) {
    const layer = svgElement('g', {});
    for (const structure of FORTRESSES.filter((s) => s.kind === kind)) {
      const number = structure.name.split(' ')[1] ?? '';
      const rewards = structure.rewards.length ? `\n${rewardLines(structure)}` : '';
      layer.append(drawMarker({
        x: structure.x,
        y: structure.y,
        shape,
        color,
        text: number,
        tooltip: `${structure.name} (${structure.x}, ${structure.y})${rewards}`,
      }));
    }
    layers[kind] = layer;
    map.append(layer);
  }

  function drawLegendEntry({ layerId, label, color, shape, count }) {
    const entry = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = true;
    checkbox.addEventListener('change', () => {
      layers[layerId].style.display = checkbox.checked ? '' : 'none';
    });
    const swatch = document.createElement('span');
    swatch.className = `swatch ${shape === 'circle' ? 'circle' : shape === 'diamond' ? 'diamond' : shape === 'star' ? 'star' : ''}`;
    swatch.style.background = color;
    const name = document.createElement('span');
    name.textContent = label;
    const total = document.createElement('span');
    total.className = 'count';
    total.textContent = count;
    entry.append(checkbox, swatch, name, total);
    legend.append(entry);
  }

  drawGrid();
  FACILITIES.forEach(drawFacilityLayer);
  FORTRESS_KINDS.forEach(drawFortressLayer);

  FACILITIES.forEach((facility) => drawLegendEntry({
    layerId: facility.id,
    label: `${facility.name} (${facility.bonusStat})`,
    color: FACILITY_COLORS[facility.id],
    shape: 'circle',
    count: facility.levels.reduce((sum, level) => sum + level.available, 0),
  }));
  FORTRESS_KINDS.forEach(({ kind, label, color, shape }) => drawLegendEntry({
    layerId: kind,
    label,
    color,
    shape,
    count: FORTRESSES.filter((s) => s.kind === kind).length,
  }));
</script>
</body>
</html>
