<head>
<meta charset="UTF-8" />

<title>Alliance Tech Tree</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #16202c;
    --panel-border: #26374a;
    --text: #e6edf5;
    --text-dim: #8fa1b3;
    --accent: #4fc3f7;
    --line: #3a86c8;
    --line-dim: #2a3a4c;
    --node-bg: #1c2e42;
    --node-border: #2f4b68;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 60px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { color: var(--text-dim); margin: 0 0 18px; font-size: 0.85rem; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .tab.active { background: var(--accent); color: #06222e; border-color: var(--accent); font-weight: 600; }
  .meta { color: var(--text-dim); font-size: 0.82rem; margin-bottom: 16px; }
  .scroll-wrap {
    overflow: auto;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    background: var(--panel);
    padding: 24px;
  }
  .tree-canvas { position: relative; margin: 0 auto; }
  .tree-canvas svg { position: absolute; top: 0; left: 0; overflow: visible; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; opacity: 0.55; }
  .tree-canvas.focus .edge { stroke: var(--line-dim); opacity: 1; }
  .tree-canvas.focus .edge.lit { stroke: var(--accent); }
  .node { position: absolute; display: flex; flex-direction: column; align-items: center; width: 76px; }
  .tree-canvas.focus .node { opacity: 0.35; }
  .tree-canvas.focus .node.lit { opacity: 1; }
  .node-tier {
    position: absolute;
    top: -6px;
    left: 2px;
    background: var(--accent);
    color: #06222e;
    font-size: 0.6rem;
    font-weight: 700;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    z-index: 2;
  }
  .node-icon {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    border: 2px solid var(--node-border);
    background: var(--node-bg);
    overflow: hidden;
    z-index: 1;
  }
  .node-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .node-name { margin-top: 4px; font-size: 0.62rem; text-align: center; line-height: 1.15; max-width: 76px; }
  .node-levels {
    margin-top: 2px;
    font-size: 0.6rem;
    color: var(--text-dim);
    background: #0f1720;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 1px 6px;
  }
</style>
</head>

<script>
  const TECH = JSON.parse(document.getElementById('tech-data').textContent);
  const CATEGORIES = ['Growth', 'Territory', 'Battle'];
  const RANK_GAP = 150;
  const LANE_GAP = 96;
  const NODE_W = 76;
  const NODE_H = 52;
  const NODE_LABEL_H = 42;
  const LAYOUT_PASSES = 4;
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const tabs = document.getElementById('tabs');
  const meta = document.getElementById('meta');
  const canvas = document.getElementById('canvas');
  let active = CATEGORIES[0];
  let activeGraph;

  function prerequisiteIds(node) {
    return [...new Set(node.levels.flatMap((level) => level.prerequisites.map((p) => p.id)))];
  }

  function buildGraph(nodes) {
    const parents = new Map(nodes.map((n) => [n.id, prerequisiteIds(n)]));
    const children = new Map(nodes.map((n) => [n.id, []]));
    parents.forEach((ids, id) => ids.forEach((parent) => children.get(parent).push(id)));
    return { parents, children };
  }

  function computeRanks(nodes, parents) {
    const rank = new Map();
    function rankOf(id) {
      if (!rank.has(id)) {
        const ids = parents.get(id);
        rank.set(id, ids.length === 0 ? 0 : Math.max(...ids.map(rankOf)) + 1);
      }
      return rank.get(id);
    }
    nodes.forEach((n) => rankOf(n.id));
    return rank;
  }

  function layout(nodes, graph) {
    const rank = computeRanks(nodes, graph.parents);
    const maxRank = Math.max(...rank.values());
    const ranks = Array.from({ length: maxRank + 1 }, (_, r) =>
      nodes.filter((n) => rank.get(n.id) === r).map((n) => n.id).sort());
    const across = new Map();
    ranks.forEach((group) => group.forEach((id, i) => across.set(id, i * LANE_GAP + LANE_GAP / 2)));

    function pass(forward) {
      const order = forward ? ranks.slice(1) : ranks.slice(0, -1).reverse();
      order.forEach((group) => {
        const scored = group.map((id) => {
          const neighbors = (forward ? graph.parents : graph.children).get(id);
          const avg = neighbors.length
            ? neighbors.reduce((sum, n) => sum + across.get(n), 0) / neighbors.length
            : across.get(id);
          return { id, avg };
        });
        scored.sort((a, b) => a.avg - b.avg || across.get(a.id) - across.get(b.id));
        scored.forEach((s, i) => across.set(s.id, i * LANE_GAP + LANE_GAP / 2));
      });
    }
    for (let i = 0; i < LAYOUT_PASSES; i++) { pass(true); pass(false); }

    const width = Math.max(...ranks.map((g) => g.length)) * LANE_GAP;
    ranks.forEach((group) => {
      const offset = (width - group.length * LANE_GAP) / 2;
      const ordered = [...group].sort((a, b) => across.get(a) - across.get(b));
      ordered.forEach((id, i) => across.set(id, offset + i * LANE_GAP + LANE_GAP / 2));
    });
    const pos = new Map(nodes.map((n) => [n.id, { x: across.get(n.id), y: rank.get(n.id) * RANK_GAP + RANK_GAP / 2 }]));
    return { pos, width, height: (maxRank + 1) * RANK_GAP };
  }

  function relatives(id, edgeMap) {
    const seen = new Set();
    const stack = [id];
    while (stack.length) {
      edgeMap.get(stack.pop()).forEach((next) => {
        if (!seen.has(next)) { seen.add(next); stack.push(next); }
      });
    }
    return seen;
  }

  function tooltip(node) {
    const last = node.levels[node.levels.length - 1];
    const lines = [node.name, node.description, `${node.levels.length} level${node.levels.length === 1 ? '' : 's'}`];
    if (last.bonus) lines.push(`Max bonus: ${last.bonus}`);
    return lines.join('\n');
  }

  function renderNode(node, p) {
    const el = document.createElement('div');
    el.className = 'node';
    el.dataset.id = node.id;
    el.style.left = `${p.x - NODE_W / 2}px`;
    el.style.top = `${p.y - NODE_H / 2}px`;
    el.title = tooltip(node);

    const tier = document.createElement('div');
    tier.className = 'node-tier';
    tier.textContent = `T${node.tier}`;
    const icon = document.createElement('div');
    icon.className = 'node-icon';
    const img = document.createElement('img');
    img.src = `..${node.img}`;
    img.alt = node.name;
    img.loading = 'lazy';
    icon.append(img);
    const name = document.createElement('div');
    name.className = 'node-name';
    name.textContent = node.name;
    const levels = document.createElement('div');
    levels.className = 'node-levels';
    levels.textContent = `Lv 1–${node.levels.length}`;
    el.append(tier, icon, name, levels);
    return el;
  }

  function renderEdges(nodes, graph, pos, size) {
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('width', size.width);
    svg.setAttribute('height', size.height);
    nodes.forEach((node) => graph.parents.get(node.id).forEach((parentId) => {
      const from = pos.get(parentId);
      const to = pos.get(node.id);
      const y1 = from.y + NODE_H / 2 + NODE_LABEL_H;
      const y2 = to.y - NODE_H / 2;
      const midY = (y1 + y2) / 2;
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('class', 'edge');
      path.setAttribute('d', `M ${from.x} ${y1} V ${midY} H ${to.x} V ${y2}`);
      path.dataset.from = parentId;
      path.dataset.to = node.id;
      svg.append(path);
    }));
    return svg;
  }

  function highlightOnHover() {
    canvas.addEventListener('mouseover', (event) => {
      const nodeEl = event.target.closest('.node');
      if (!nodeEl) return;
      const id = nodeEl.dataset.id;
      const lit = new Set([id, ...relatives(id, activeGraph.parents), ...relatives(id, activeGraph.children)]);
      canvas.classList.add('focus');
      canvas.querySelectorAll('.node').forEach((el) => el.classList.toggle('lit', lit.has(el.dataset.id)));
      canvas.querySelectorAll('.edge').forEach((el) =>
        el.classList.toggle('lit', lit.has(el.dataset.from) && lit.has(el.dataset.to)));
    });
    canvas.addEventListener('mouseout', (event) => {
      if (event.target.closest('.node')) canvas.classList.remove('focus');
    });
  }

  function renderTree() {
    const nodes = TECH.filter((n) => n.category === active);
    const graph = buildGraph(nodes);
    const size = layout(nodes, graph);
    canvas.replaceChildren();
    canvas.classList.remove('focus');
    canvas.style.width = `${size.width}px`;
    canvas.style.height = `${size.height + NODE_LABEL_H}px`;
    canvas.append(renderEdges(nodes, graph, size.pos, size));
    nodes.forEach((node) => canvas.append(renderNode(node, size.pos.get(node.id))));
    meta.textContent = `${nodes.length} tech lines`;
    activeGraph = graph;
  }

  highlightOnHover();

  function renderTabs() {
    tabs.replaceChildren();
    CATEGORIES.forEach((category) => {
      const button = document.createElement('button');
      button.className = `tab${category === active ? ' active' : ''}`;
      button.textContent = category;
      button.addEventListener('click', () => { active = category; renderTabs(); renderTree(); });
      tabs.append(button);
    });
  }

  renderTabs();
  renderTree();
</script>
</body>
</html>
