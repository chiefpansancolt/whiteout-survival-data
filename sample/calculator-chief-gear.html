<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chief Gear Upgrade Calculator</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #16202c;
    --panel-border: #26374a;
    --text: #e6edf5;
    --text-dim: #8fa1b3;
    --accent: #4fc3f7;
    --row-alt: #131d27;
    --good: #52d17a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 60px;
    max-width: 980px;
  }
  a { color: var(--accent); }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 0.85rem; margin: 24px 0 8px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  p.sub { color: var(--text-dim); margin: 0 0 18px; font-size: 0.85rem; line-height: 1.45; }
  .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .controls label { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; }
  select, input[type="number"] {
    background: #0f1720;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 0.9rem;
  }
  input[type="number"] { width: 110px; text-align: right; }
  select:disabled { opacity: 0.45; }
  button {
    background: #0f1720;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .bonus-note { color: var(--good); font-size: 0.85rem; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 10px; }
  .pill {
    background: #0f1720;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 4px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .pill.active { background: var(--accent); color: #06222e; border-color: var(--accent); font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--panel-border); text-align: left; vertical-align: middle; }
  th { color: var(--text-dim); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tbody tr:nth-child(even) td { background: var(--row-alt); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--panel-border); }
  td.bonus { color: var(--good); }
  .scroll { overflow-x: auto; }
  .note { color: var(--text-dim); font-size: 0.8rem; margin: 8px 0 0; line-height: 1.4; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 12px 14px; }
  .stat .value { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
  .stat .label { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  select.level { width: 100%; min-width: 150px; }
  .mat { display: inline-flex; align-items: center; gap: 8px; }
  .mat img { width: 28px; height: 28px; border-radius: 6px; }
  .warn { color: #ffb74d; font-size: 0.8rem; }
  .group-row td { background: var(--panel); color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--panel-border); }
</style>
</head>
<body>
  <p><a href="index.html">&larr; All sample pages</a></p>
  <h1 id="page-title"></h1>
  <p class="sub" id="page-intro"></p>

  <div class="card">
    <div class="controls">
      <strong id="all-label"></strong>
      <label>From <select id="all-from" class="level"></select></label>
      <label>To <select id="all-to" class="level"></select></label>
      <button type="button" id="all-apply">Apply</button>
      <button type="button" id="reset">Reset all</button>
    </div>
  </div>

  <h2>Results</h2>
  <div class="grid" id="stats"></div>
  <div class="card scroll" id="materials-card"></div>
  <h2>Event points</h2>
  <div class="card scroll" id="events-card"></div>
  <p class="note" id="events-note"></p>

  <h2 id="table-title"></h2>
  <div class="card scroll"><table id="piece-table"></table></div>

","amount":64000},{"itemId":"polishing-solution","amount":600},{"itemId":"design-plans","amount":100},{"itemId":"lunar-amber","amount":16}],"powerTotal":5752000,"score":3080},{"id":"legendary-t6-star-1-stage-2","name":"Legendary T6 Star 1 Stage 2","materials":[{"itemId":"hardened-alloy","amount":64000},{"itemId":"polishing-solution","amount":600},{"itemId":"design-plans","amount":100},{"itemId":"lunar-amber","amount":16}],"powerTotal":5793000,"score":3080},{"id":"legendary-t6-star-1-stage-3","name":"Legendary T6 Star 1 Stage 3","materials":[{"itemId":"hardened-alloy","amount":64000},{"itemId":"polishing-solution","amount":600},{"itemId":"design-plans","amount":100},{"itemId":"lunar-amber","amount":16}],"powerTotal":5834000,"score":3080},{"id":"legendary-t6-star-1-stage-4","name":"Legendary T6 Star 1 Stage 4","materials":[{"itemId":"hardened-alloy","amount":64000},{"itemId":"polishing-solution","amount":600},{"itemId":"design-plans","amount":100},{"itemId":"lunar-amber","amount":16}],"powerTotal":5875000,"score":3080},{"id":"legendary-t6-star-2-stage-0","name":"Legendary T6 Star 2 Stage 0","materials":[{"itemId":"hardened-alloy","amount":64000},{"itemId":"polishing-solution","amount":600},{"itemId":"design-plans","amount":100},{"itemId":"lunar-amber","amount":16}],"powerTotal":5916000,"score":3080},{"id":"legendary-t6-star-2-stage-1","name":"Legendary T6 Star 2 Stage 1","materials":[{"itemId":"hardened-alloy","amount":68000},{"itemId":"polishing-solution","amount":630},{"itemId":"design-plans","amount":105},{"itemId":"lunar-amber","amount":16}],"powerTotal":5956000,"score":3078},{"id":"legendary-t6-star-2-stage-2","name":"Legendary T6 Star 2 Stage 2","materials":[{"itemId":"hardened-alloy","amount":68000},{"itemId":"polishing-solution","amount":630},{"itemId":"design-plans","amount":105},{"itemId":"lunar-amber","amount":16}],"powerTotal":5997000,"score":3078},{"id":"legendary-t6-star-2-stage-3","name":"Legendary T6 Star 2 Stage 3","materials":[{"itemId":"hardened-alloy","amount":68000},{"itemId":"polishing-solution","amount":630},{"itemId":"design-plans","amount":105},{"itemId":"lunar-amber","amount":16}],"powerTotal":6038000,"score":3078},{"id":"legendary-t6-star-2-stage-4","name":"Legendary T6 Star 2 Stage 4","materials":[{"itemId":"hardened-alloy","amount":68000},{"itemId":"polishing-solution","amount":630},{"itemId":"design-plans","amount":105},{"itemId":"lunar-amber","amount":16}],"powerTotal":6079000,"score":3078},{"id":"legendary-t6-star-3-stage-0","name":"Legendary T6 Star 3 Stage 0","materials":[{"itemId":"hardened-alloy","amount":68000},{"itemId":"polishing-solution","amount":630},{"itemId":"design-plans","amount":105},{"itemId":"lunar-amber","amount":16}],"powerTotal":6120000,"score":3078}],"rows":[{"label":"Cap"},{"label":"Watch"},{"label":"Coat"},{"label":"Pants"},{"label":"Ring"},{"label":"Weapon"}],"items":{"hardened-alloy":{"name":"Hardened Alloy","img":"/images/items/hardened-alloy.png"},"polishing-solution":{"name":"Polishing Solution","img":"/images/items/polishing-solution.png"},"design-plans":{"name":"Design Plans","img":"/images/items/design-plans.png"},"lunar-amber":{"name":"Lunar Amber","img":"/images/items/lunar-amber.png"}},"materialOrder":["hardened-alloy","polishing-solution","design-plans","lunar-amber"],"perScore":{"svs":36,"allianceShowdown":22,"kingOfIcefield":36,"hallOfChief":500},"scoreLabel":"Gear score","pieceLabel":"Gear piece","tableTitle":"Chief gear pieces","eventsNote":"Event points are the gear score times the points that the \"Raise Chief Gear max score\" row pays in each event. The score of the steps inside a level is an even split of the level score, taken from WoS Tools."}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('upgrade-data').textContent);
  const fmt = (n) => n.toLocaleString('en-US');
  const rows = DATA.rows.map((row) => ({ label: row.label, group: row.group, from: '', to: '' }));
  const EVENTS = [['svs', 'SvS'], ['allianceShowdown', 'Alliance Showdown'], ['kingOfIcefield', 'King of Icefield'], ['hallOfChief', 'Hall of Chief']];

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function levelIndex(id) {
    return id === '' ? -1 : DATA.levels.findIndex((l) => l.id === id);
  }

  function calculate() {
    const totals = new Map();
    let score = 0, power = 0, steps = 0;
    const issues = rows.map((row) => {
      const from = levelIndex(row.from);
      const to = levelIndex(row.to);
      if (to === -1) return '';
      if (to < from) return 'The end level is below the start level, so this row is skipped.';
      if (to === from) return '';
      for (let k = from + 1; k <= to; k++) {
        steps++;
        score += DATA.levels[k].score;
        DATA.levels[k].materials.forEach((m) => totals.set(m.itemId, (totals.get(m.itemId) || 0) + m.amount));
      }
      power += DATA.levels[to].powerTotal - (from === -1 ? 0 : DATA.levels[from].powerTotal);
      return '';
    });
    return { totals, score, power, steps, issues };
  }

  function renderResults(result) {
    const stats = document.getElementById('stats');
    stats.replaceChildren();
    [[DATA.scoreLabel, result.score], ['Power gained', result.power], ['Steps', result.steps]].forEach(([label, value]) => {
      const box = el('div', 'stat');
      box.append(el('div', 'value', fmt(value)), el('div', 'label', label));
      stats.append(box);
    });

    const matCard = document.getElementById('materials-card');
    matCard.replaceChildren();
    const matTable = el('table');
    const head = matTable.createTHead().insertRow();
    ['Material', 'Amount'].forEach((l, i) => head.append(el('th', i ? 'num' : '', l)));
    const body = matTable.createTBody();
    DATA.materialOrder.forEach((itemId) => {
      const amount = result.totals.get(itemId) || 0;
      if (amount === 0) return;
      const item = DATA.items[itemId];
      const row = body.insertRow();
      const wrap = el('span', 'mat');
      const img = el('img'); img.src = '..' + item.img; img.alt = ''; img.onerror = () => { img.style.visibility = 'hidden'; };
      wrap.append(img, document.createTextNode(item.name));
      row.insertCell().append(wrap);
      const c = row.insertCell(); c.className = 'num'; c.textContent = fmt(amount);
    });
    if (!body.rows.length) { const row = body.insertRow(); const c = row.insertCell(); c.colSpan = 2; c.className = 'note'; c.textContent = 'Choose a start and end level to see the materials.'; }
    matCard.append(matTable);

    const evCard = document.getElementById('events-card');
    evCard.replaceChildren();
    const evTable = el('table');
    const evHead = evTable.createTHead().insertRow();
    ['Event', 'Points'].forEach((l, i) => evHead.append(el('th', i ? 'num' : '', l)));
    const evBody = evTable.createTBody();
    EVENTS.forEach(([key, name]) => {
      const row = evBody.insertRow();
      row.insertCell().textContent = name;
      const c = row.insertCell(); c.className = 'num'; c.textContent = fmt(result.score * DATA.perScore[key]);
    });
    evCard.append(evTable);
  }

  function optionList(select, noneLabel) {
    select.replaceChildren();
    const none = el('option', '', noneLabel); none.value = ''; select.append(none);
    DATA.levels.forEach((l) => { const o = el('option', '', l.name); o.value = l.id; select.append(o); });
  }

  function renderTable(issues) {
    const table = document.getElementById('piece-table');
    table.replaceChildren();
    const head = table.createTHead().insertRow();
    [DATA.pieceLabel, 'From', 'To', ''].forEach((l) => head.append(el('th', '', l)));
    const body = table.createTBody();
    let lastGroup = null;
    rows.forEach((row, i) => {
      if (row.group && row.group !== lastGroup) {
        lastGroup = row.group;
        const g = body.insertRow(); g.className = 'group-row'; const c = g.insertCell(); c.colSpan = 4; c.textContent = row.group;
      }
      const tr = body.insertRow();
      tr.insertCell().textContent = row.label;
      [['from', 'None (not started)'], ['to', 'None (skip)']].forEach(([key, noneLabel]) => {
        const select = el('select', 'level');
        optionList(select, noneLabel);
        select.value = row[key];
        select.setAttribute('aria-label', `${row.label} ${key}`);
        select.addEventListener('change', () => { row[key] = select.value; update(); });
        tr.insertCell().append(select);
      });
      const warn = tr.insertCell();
      warn.className = 'warn';
      warn.textContent = issues[i] || '';
    });
  }

  function update() {
    const result = calculate();
    renderResults(result);
    document.querySelectorAll('#piece-table tbody tr:not(.group-row)').forEach((tr, i) => { tr.lastElementChild.textContent = result.issues[i] || ''; });
  }

  function render() {
    const result = calculate();
    renderTable(result.issues);
    renderResults(result);
  }

  document.getElementById('page-title').textContent = DATA.title;
  document.getElementById('page-intro').textContent = DATA.intro;
  document.getElementById('all-label').textContent = `Set every ${DATA.pieceLabel.toLowerCase()}`;
  document.getElementById('events-note').textContent = DATA.eventsNote;
  document.getElementById('table-title').textContent = DATA.tableTitle;
  optionList(document.getElementById('all-from'), 'None (not started)');
  optionList(document.getElementById('all-to'), 'None (skip)');
  document.getElementById('all-apply').addEventListener('click', () => {
    const from = document.getElementById('all-from').value, to = document.getElementById('all-to').value;
    rows.forEach((r) => { r.from = from; r.to = to; });
    render();
  });
  document.getElementById('reset').addEventListener('click', () => {
    rows.forEach((r) => { r.from = ''; r.to = ''; });
    document.getElementById('all-from').value = '';
    document.getElementById('all-to').value = '';
    render();
  });
  render();
})();
</script>
</body>
