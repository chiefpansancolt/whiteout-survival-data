<head>
<meta charset="UTF-8" />

<style>
  :root { --bg:#0f1720; --panel:#16202c; --border:#26374a; --text:#e6edf5; --dim:#8fa1b3; --accent:#4fc3f7; --good:#52d17a; --bad:#ff7a7a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:20px 16px 60px; max-width:1200px; }
  a { color:var(--accent); }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  p.sub { color:var(--dim); margin:0 0 16px; font-size:0.85rem; line-height:1.45; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  #summary { display:flex; flex-wrap:wrap; gap:24px; }
  .stat b { font-size:1.4rem; } .stat span { color:var(--dim); font-size:0.85rem; }
  .good { color:var(--good); } .bad { color:var(--bad); }
  .controls { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-bottom:10px; }
  input[type="search"] { background:#0f1720; border:1px solid var(--border); color:var(--text); border-radius:6px; padding:7px 10px; font-size:0.9rem; width:240px; }
  label { font-size:0.9rem; display:inline-flex; gap:6px; align-items:center; }
  #count { color:var(--dim); font-size:0.85rem; }
  #categories { display:flex; flex-wrap:wrap; gap:6px; }
  .pill { background:#0f1720; border:1px solid var(--border); color:var(--text); border-radius:999px; padding:4px 11px; font-size:0.8rem; cursor:pointer; }
  .pill.active { border-color:var(--accent); color:var(--accent); }
  .missing-count { color:var(--bad); }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
  .item { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px 8px; text-align:center; }
  .item.no-icon { border-color:var(--bad); }
  .icon { width:64px; height:64px; object-fit:contain; display:block; margin:0 auto 6px; }
  .icon.blank { display:flex; align-items:center; justify-content:center; border:1px dashed var(--bad); border-radius:8px; color:var(--bad); font-size:0.7rem; }
  .name { font-size:0.8rem; line-height:1.25; }
  .id { color:var(--dim); font-size:0.65rem; margin-top:3px; word-break:break-all; }
  .cat { color:var(--dim); font-size:0.65rem; margin-top:2px; }
</style>

    const total = el('div', 'stat');
    total.append(el('b', '', String(ITEMS.length)), el('span', '', ' items'));
    const missing = ITEMS.filter((i) => !hasIcon(i)).length;
    const gap = el('div', 'stat');
    gap.append(el('b', 'bad', String(missing)), el('span', '', ' without an icon'));
    const done = el('div', 'stat');
    done.append(el('b', 'good', String(ITEMS.length - missing)), el('span', '', ' with an icon'));
    box.append(total, done, gap);
  }

  function renderCategories() {
    const box = document.getElementById('categories');
    box.replaceChildren();
    for (const name of ['All', ...CATEGORIES]) {
      const inCategory = ITEMS.filter((i) => name === 'All' || i.category === name);
      const missing = inCategory.filter((i) => !hasIcon(i)).length;
      const button = el('button', 'pill' + (state.category === name ? ' active' : ''));
      button.append(el('span', '', name + ' ' + inCategory.length));
      if (missing > 0) button.append(el('span', 'missing-count', ' (' + missing + ' missing)'));
      button.addEventListener('click', () => { state.category = name; render(); });
      box.append(button);
    }
  }

  function matches(item) {
    if (state.category !== 'All' && item.category !== state.category) return false;
    if (state.missingOnly && hasIcon(item)) return false;
    const q = state.query.trim().toLowerCase();
    return q === '' || item.name.toLowerCase().includes(q) || item.id.includes(q);
  }

  function renderGrid() {
    const shown = ITEMS.filter(matches);
    document.getElementById('count').textContent = shown.length + ' shown';
    const grid = document.getElementById('grid');
    grid.replaceChildren();
    for (const item of shown) {
      const card = el('div', 'item' + (hasIcon(item) ? '' : ' no-icon'));
      card.title = item.sources.length > 0 ? 'Sources: ' + item.sources.join(', ') : 'No sources listed';
      if (hasIcon(item)) {
        const img = el('img', 'icon');
        img.src = '../..' + item.img;
        img.alt = item.name;
        img.loading = 'lazy';
        card.append(img);
      } else {
        card.append(el('div', 'icon blank', 'No icon'));
      }
      card.append(el('div', 'name', item.name), el('div', 'id', item.id), el('div', 'cat', item.category));
      grid.append(card);
    }
  }

  function render() { renderCategories(); renderGrid(); }
  renderSummary();
  document.getElementById('search').addEventListener('input', (e) => { state.query = e.target.value; renderGrid(); });
  document.getElementById('missing-only').addEventListener('change', (e) => { state.missingOnly = e.target.checked; renderGrid(); });
  render();
</script>
</body>
</html>
