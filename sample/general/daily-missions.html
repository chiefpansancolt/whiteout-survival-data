<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daily Missions</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #16202c;
    --panel-border: #26374a;
    --text: #e6edf5;
    --text-dim: #8fa1b3;
    --accent: #4fc3f7;
    --row-alt: #131d27;
    --good: #52d17a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 60px;
    max-width: 980px;
  }
  a { color: var(--accent); }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 0.85rem; margin: 24px 0 8px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  p.sub { color: var(--text-dim); margin: 0 0 18px; font-size: 0.85rem; line-height: 1.45; }
  .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .controls label { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; }
  select, input[type="number"] {
    background: #0f1720;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 0.9rem;
  }
  input[type="number"] { width: 110px; text-align: right; }
  select:disabled { opacity: 0.45; }
  button {
    background: #0f1720;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .bonus-note { color: var(--good); font-size: 0.85rem; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 10px; }
  .pill {
    background: #0f1720;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 4px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .pill.active { background: var(--accent); color: #06222e; border-color: var(--accent); font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--panel-border); text-align: left; vertical-align: middle; }
  th { color: var(--text-dim); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tbody tr:nth-child(even) td { background: var(--row-alt); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--panel-border); }
  td.bonus { color: var(--good); }
  .scroll { overflow-x: auto; }
  .note { color: var(--text-dim); font-size: 0.8rem; margin: 8px 0 0; line-height: 1.4; }

  body { max-width: 1200px; }
  .levels { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
  .level { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 150px; flex: 1 1 190px; padding: 8px 10px; background: #0f1720; border: 1px solid var(--panel-border); border-radius: 8px; }
  .lrewards { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
  .level strong { font-size: 1.1rem; color: var(--good); }
  .inline { font-size: 0.75rem; color: var(--text-dim); }
  .missions { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; margin-top: 10px; }
  .mission { background: #0f1720; border: 1px solid var(--panel-border); border-radius: 8px; padding: 10px 12px; min-width: 0; }
  .mhead { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
  .mlevel { border-top: 1px solid var(--panel-border); padding: 8px 0 2px; display: flex; flex-direction: column; gap: 6px; }
  .lv { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
  .task { font-size: 0.9rem; }
  .facts { font-size: 0.8rem; color: var(--text-dim); }
  .mhead { flex-direction: row; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .mtitle { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .hint { flex-basis: 100%; font-size: 0.75rem; color: var(--text-dim); }
  .done { display: inline-flex; align-items: center; gap: 5px; font-size: 0.8rem; cursor: pointer; }
  .mission.checked { border-color: var(--good); }
  .level.reached { border-color: var(--good); background: #10281b; }
  .reward.activeness { border-color: var(--accent); }
  .sumbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 8px 0; }
  #sum { font-weight: 700; color: var(--good); }
  .rewards { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter { width: 100%; max-width: 420px; background: #0f1720; border: 1px solid var(--panel-border); color: var(--text); border-radius: 6px; padding: 6px 8px; }
  ul.dailies { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 2px; }
  ul.dailies li { display: flex; gap: 10px; align-items: baseline; font-size: 0.85rem; padding: 3px 0; border-bottom: 1px solid var(--panel-border); }
  ul.dailies .num { width: 26px; text-align: right; color: var(--text-dim); }
  .reward { display: inline-flex; align-items: center; gap: 6px; background: #0f1720; border: 1px solid var(--panel-border); border-radius: 6px; padding: 2px 8px; font-size: 0.8rem; }
</style>
</head>

<script>
  const MISSIONS = JSON.parse(document.getElementById('mission-data').textContent);
  const LEVELS = JSON.parse(document.getElementById('level-data').textContent);
  const DAILIES = JSON.parse(document.getElementById('daily-data').textContent);
  const ITEMS = JSON.parse(document.getElementById('item-data').textContent);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
  const fmt = (n) => n.toLocaleString();
  const activenessOf = (level) => level.rewards.filter((r) => r.itemId === 'activeness').reduce((sum, r) => sum + r.amount, 0);
  const through = (mission, k) => mission.levels.slice(0, k + 1).reduce((sum, l) => sum + activenessOf(l), 0);
  const selected = (i) => (selects[i] ? Number(selects[i].value) : 0);
  function reward(r) {
    const chip = el('span', r.itemId === 'activeness' ? 'reward activeness' : 'reward');
    const item = ITEMS[r.itemId];
    if (item.img) { const img = el('img'); img.src = '../..' + item.img; img.alt = item.name; img.width = 26; img.height = 26; chip.append(img); }
    chip.append(el('span', '', fmt(r.amount) + ' ' + item.name));
    return chip;
  }
  const cards = [], checks = [], selects = [], boxes = [], hints = [];
  function missionCard(m, i) {
    const card = el('div', 'mission');
    card.dataset.name = (m.name + ' ' + m.id).toLowerCase();
    const head = el('div', 'mhead');
    const title = el('div', 'mtitle');
    title.append(el('strong', '', (i + 1) + '. ' + m.name), el('span', 'inline', m.id));
    const check = el('input'); check.type = 'checkbox'; check.title = 'Done today';
    const pick = el('label', 'done'); pick.append(check, el('span', '', 'Done'));
    head.append(title, pick);
    let select = null, hint = null;
    if (m.levels.length > 1) {
      select = el('select');
      m.levels.forEach((l, k) => { const o = el('option', '', 'Level ' + l.level); o.value = String(k); select.append(o); });
      select.value = '0';
      select.addEventListener('input', () => update());
      head.append(select);
      hint = el('span', 'hint');
      head.append(hint);
    }
    check.addEventListener('input', () => update());
    card.append(head);
    m.levels.forEach((l) => {
      const block = el('div', 'mlevel');
      block.append(el('span', 'lv', 'Level ' + l.level), el('span', 'task', l.task));
      block.append(el('div', 'facts', 'Target ' + fmt(l.target)));
      const rewards = el('div', 'rewards');
      l.rewards.forEach((r) => rewards.append(reward(r)));
      block.append(rewards);
      card.append(block);
    });
    checks.push(check); selects.push(select); hints.push(hint);
    return card;
  }
  function sumOfChecked() {
    return MISSIONS.reduce((sum, m, i) => sum + (checks[i].checked ? through(m, selected(i)) : 0), 0);
  }
  function update() {
    const sum = sumOfChecked();
    const all = MISSIONS.reduce((total, m, i) => total + through(m, selected(i)), 0);
    document.getElementById('sum').textContent = 'Activeness: ' + fmt(sum) + ' of ' + fmt(all) + ' from the missions';
    boxes.forEach((box, k) => { box.classList.toggle('reached', sum >= LEVELS[k].activeness); });
    cards.forEach((c, i) => c.classList.toggle('checked', checks[i].checked));
    hints.forEach((h, i) => { if (h) h.textContent = 'Counts levels 1 to ' + MISSIONS[i].levels[selected(i)].level + ': ' + fmt(through(MISSIONS[i], selected(i))) + ' activeness'; });
  }
  function render() {
    const bar = document.getElementById('levels');
    LEVELS.forEach((l) => {
      const box = el('div', 'level');
      box.append(el('strong', '', fmt(l.activeness)), el('span', 'inline', l.rewards.length + ' rewards'));
      const list = el('div', 'lrewards');
      l.rewards.forEach((r) => list.append(reward(r)));
      box.append(list);
      bar.append(box); boxes.push(box);
    });
    const total = MISSIONS.reduce((sum, m) => sum + activenessOf(m.levels[0]), 0);
    const levelCount = MISSIONS.reduce((sum, m) => sum + m.levels.length, 0);
    document.getElementById('summary').textContent = MISSIONS.length + ' missions, ' + levelCount + ' levels, ' + fmt(total) + ' activeness in all at level 1. Reward levels: ' + LEVELS.length + '.';
    const grid = document.getElementById('missions');
    MISSIONS.forEach((m, i) => { const c = missionCard(m, i); cards.push(c); grid.append(c); });
    document.getElementById('check-all').addEventListener('click', () => { checks.forEach((c) => { c.checked = true; }); update(); });
    document.getElementById('clear-all').addEventListener('click', () => { checks.forEach((c) => { c.checked = false; }); update(); });
    const filter = document.getElementById('filter');
    filter.addEventListener('input', () => {
      const q = filter.value.toLowerCase();
      cards.forEach((c) => { c.style.display = c.dataset.name.includes(q) ? '' : 'none'; });
    });
    const list = document.getElementById('dailies');
    DAILIES.forEach((d, i) => {
      const li = el('li');
      li.append(el('span', 'num', String(i + 1)), el('span', '', d.name), el('span', 'inline', d.id));
      list.append(li);
    });
    document.getElementById('dailies-count').textContent = DAILIES.length + ' daily tasks';
    update();
  }
  render();
</script>
</body>
</html>
