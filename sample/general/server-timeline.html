<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Server Timeline Explorer</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #16202c;
    --panel-border: #26374a;
    --text: #e6edf5;
    --text-dim: #8fa1b3;
    --accent: #4fc3f7;
    --unlocked: #52d17a;
    --legendary: #ffb84f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 60px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { color: var(--text-dim); margin: 0 0 18px; font-size: 0.85rem; }
  .controls { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; align-items: end; }
  .controls label { display: flex; flex-direction: column; gap: 4px; font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .controls input { background: var(--panel); color: var(--text); border: 1px solid var(--panel-border); border-radius: 8px; padding: 8px 10px; font-size: 0.9rem; color-scheme: dark; }
  .summary { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 10px 16px; min-width: 110px; }
  .card .value { font-size: 1.3rem; font-weight: 700; }
  .card .label { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .card.total { border-color: var(--accent); }
  .card.total .value { color: var(--accent); }
  .error { color: #ff7b7b; font-size: 0.85rem; min-height: 1.2em; margin-bottom: 10px; }

  .columns { display: grid; grid-template-columns: 1fr 90px 1fr; gap: 0 12px; max-width: 1000px; }
  .col-title { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; padding-bottom: 8px; }
  .col-title.right { text-align: right; }
  .col-title.mid { text-align: center; }
  .left, .right { padding: 8px 0; }
  .right { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; justify-content: flex-end; }
  .mid { position: relative; text-align: center; padding: 8px 0; }
  .mid::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--panel-border); transform: translateX(-50%); }
  .day { position: relative; display: inline-block; background: var(--panel); border: 2px solid var(--panel-border); border-radius: 999px; padding: 4px 10px; font-size: 0.8rem; font-weight: 700; }
  .date { position: relative; display: block; background: var(--bg); font-size: 0.68rem; color: var(--text-dim); margin-top: 2px; }
  .row.unlocked .day { border-color: var(--unlocked); color: var(--unlocked); }
  .row.next .day { border-color: var(--accent); color: var(--accent); }
  .row.locked .left, .row.locked .right { opacity: 0.4; }

  .item { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px; padding: 6px 10px; margin-bottom: 6px; font-size: 0.85rem; }
  .item img { width: 32px; height: 32px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .item .tag { color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .hero { flex-direction: column; text-align: center; width: 84px; padding: 8px 4px; margin: 0; }
  .hero img { width: 56px; height: 56px; border-radius: 10px; border: 1px solid var(--legendary); }
  .hero .tag { font-size: 0.65rem; }
  .shard-events { display: flex; justify-content: center; gap: 3px; min-height: 22px; }
  .hero .shard-events img { width: 22px; height: 22px; border-radius: 4px; border: none; }
  .unlock { display: block; }
  .badges { gap: 12px; }
  .badge { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .badge img { width: 40px; height: 40px; border-radius: 8px; }

  @media (max-width: 640px) {
    .columns { grid-template-columns: 1fr 64px 1fr; gap: 0 6px; }
    .hero { width: 70px; }
    .hero img { width: 44px; height: 44px; }
  }
</style>
</head>
<body>

<h1>Server Timeline Explorer</h1>
<p class="sub">Heroes unlock on the right. Everything else unlocks on the left. Enter the server start date to see what is unlocked. Source: whiteoutsurvival.wiki/server-timeline-server-age/</p>

<div class="controls">
  <label>Server start date
    <input type="date" id="start-date" value="2026-07-01" />
  </label>
  <label>As of
    <input type="date" id="as-of" />
  </label>
</div>
<div class="error" id="error"></div>
<div class="summary" id="summary"></div>

<div class="columns" id="timeline"></div>

<script>
  const MILESTONES = JSON.parse(document.getElementById('timeline-data').textContent);
  const MS_PER_DAY = 86400000;

  const startInput = document.getElementById('start-date');
  const asOfInput = document.getElementById('as-of');
  asOfInput.value = new Date().toISOString().slice(0, 10);

  function utcDayStart(value) {
    const parsed = new Date(value);
    if (Number.isNaN(parsed.getTime())) return null;
    return Date.UTC(parsed.getUTCFullYear(), parsed.getUTCMonth(), parsed.getUTCDate());
  }

  function escapeHtml(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function item(entry, tag) {
    return `<div class="item"><img src="../..${entry.img}" alt="" onerror="this.style.visibility='hidden'"><div>${escapeHtml(entry.name)}<div class="tag">${tag}</div></div></div>`;
  }

  function unlock(entry) {
    if (!entry.item) return `<div class="item unlock">${escapeHtml(entry.name)}</div>`;
    return `<div class="item"><img src="../..${entry.item.img}" alt="" onerror="this.style.visibility='hidden'"><div>${escapeHtml(entry.name)}</div></div>`;
  }

  function badgeRow(levels) {
    const badges = levels.map((l) => `<span class="badge"><img src="../..${l.img}" alt="${l.name}" onerror="this.style.visibility='hidden'"><span class="tag">${l.name}</span></span>`);
    return `<div class="item badges">${badges.join('')}</div>`;
  }

  function hero(entry) {
    const shards = entry.shardEvents.map((e) => `<img src="../..${e.img}" alt="${escapeHtml(e.name)}" title="${escapeHtml(e.name)}" onerror="this.style.visibility='hidden'">`).join('');
    return `<div class="item hero"><img src="../..${entry.img}" alt="" onerror="this.style.visibility='hidden'"><div>${escapeHtml(entry.name)}<div class="tag">${entry.class}</div></div><div class="shard-events">${shards}</div></div>`;
  }

  function render() {
    const start = utcDayStart(startInput.value);
    const asOf = utcDayStart(asOfInput.value);
    const error = document.getElementById('error');
    const summary = document.getElementById('summary');
    const timeline = document.getElementById('timeline');

    if (start === null || asOf === null) {
      error.textContent = 'Enter a valid start date and as-of date.';
      summary.innerHTML = '';
      timeline.innerHTML = '';
      return;
    }
    if (asOf < start) {
      error.textContent = 'The as-of date is before the server start date.';
      summary.innerHTML = '';
      timeline.innerHTML = '';
      return;
    }
    error.textContent = '';

    const age = (asOf - start) / MS_PER_DAY;
    const unlocked = MILESTONES.filter((m) => m.day <= age);
    const next = MILESTONES.find((m) => m.day > age);
    const heroCount = unlocked.reduce((sum, m) => sum + m.heroes.length, 0);
    const petCount = unlocked.reduce((sum, m) => sum + m.pets.length, 0);

    summary.innerHTML = [
      `<div class="card total"><div class="value">${age.toLocaleString()}</div><div class="label">Server age (days)</div></div>`,
      `<div class="card"><div class="value">${unlocked.length} / ${MILESTONES.length}</div><div class="label">Milestones</div></div>`,
      `<div class="card"><div class="value">${heroCount}</div><div class="label">Heroes unlocked</div></div>`,
      `<div class="card"><div class="value">${petCount}</div><div class="label">Pets unlocked</div></div>`,
      `<div class="card"><div class="value">${next ? next.day - age + ' days' : 'None'}</div><div class="label">Next unlock</div></div>`,
    ].join('');

    const rows = MILESTONES.map((m) => {
      const state = m.day <= age ? 'unlocked' : m === next ? 'next locked' : 'locked';
      const date = new Date(start + m.day * MS_PER_DAY).toISOString().slice(0, 10);
      const left = [
        ...m.pets.map((p) => item(p, 'Pet')),
        ...m.experts.map((e) => item(e, 'Expert')),
        ...m.events.map((e) => item(e, 'Event')),
        ...m.unlocks.map(unlock),
        ...(m.fireCrystalLevels.length ? [badgeRow(m.fireCrystalLevels)] : []),
      ].join('');
      const right = m.heroes.map(hero).join('');
      return `<div class="left row ${state}">${left}</div><div class="mid row ${state}"><span class="day">Day ${m.day}</span><span class="date">${date}</span></div><div class="right row ${state}">${right}</div>`;
    });

    timeline.innerHTML =
      '<div class="col-title">Everything else</div><div class="col-title mid">Day</div><div class="col-title right">Heroes</div>' +
      rows.join('');
  }

  startInput.addEventListener('input', render);
  asOfInput.addEventListener('input', render);
  render();
</script>
