<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tundra Album</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #16202c;
    --panel-border: #26374a;
    --text: #e6edf5;
    --text-dim: #8fa1b3;
    --accent: #4fc3f7;
    --row-alt: #131d27;
    --good: #52d17a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 60px;
    max-width: 980px;
  }
  a { color: var(--accent); }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 0.85rem; margin: 24px 0 8px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  p.sub { color: var(--text-dim); margin: 0 0 18px; font-size: 0.85rem; line-height: 1.45; }
  .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .controls label { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; }
  select, input[type="number"] {
    background: #0f1720;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 0.9rem;
  }
  input[type="number"] { width: 110px; text-align: right; }
  select:disabled { opacity: 0.45; }
  button {
    background: #0f1720;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .bonus-note { color: var(--good); font-size: 0.85rem; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 10px; }
  .pill {
    background: #0f1720;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 4px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .pill.active { background: var(--accent); color: #06222e; border-color: var(--accent); font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--panel-border); text-align: left; vertical-align: middle; }
  th { color: var(--text-dim); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tbody tr:nth-child(even) td { background: var(--row-alt); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--panel-border); }
  td.bonus { color: var(--good); }
  .scroll { overflow-x: auto; }
  .note { color: var(--text-dim); font-size: 0.8rem; margin: 8px 0 0; line-height: 1.4; }

  body { max-width: none; }
  .card h2 { margin: 0 0 8px; }
  .head { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 6px; }
  .buff { color: var(--good); font-weight: 700; }
  .reward { display: inline-flex; align-items: center; gap: 6px; background: #0f1720; border: 1px solid var(--panel-border); border-radius: 6px; padding: 2px 8px; margin: 2px 6px 2px 0; font-size: 0.8rem; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip.active { background: var(--accent); color: #06222e; border-color: var(--accent); font-weight: 600; }
  .puzzles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 760px) { .puzzles { grid-template-columns: 1fr; } }
  .puzzle { border: 1px solid var(--panel-border); border-radius: 8px; padding: 12px; min-width: 0; }
  .ptop { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
  .art { width: 120px; height: 120px; border-radius: 8px; object-fit: cover; flex: none; }
  .pinfo { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .counts { font-size: 0.75rem; color: var(--text-dim); white-space: pre; }
  .item { width: 28px; height: 28px; }
  .pieces { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .piece { margin: 0; text-align: center; }
  .piece-img { width: 100%; border-radius: 6px; display: block; }
  .nopic { aspect-ratio: 220 / 281; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--panel-border); color: var(--text-dim); font-size: 0.7rem; }
  .piece figcaption { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }
  .inline { font-size: 0.8rem; color: var(--text-dim); }
  .pieces-input { width: 110px; margin-left: 6px; }
  table.tiers { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.85rem; }
  table.tiers th { text-align: left; color: var(--text-dim); font-weight: 600; padding: 4px 8px; }
  table.tiers td { padding: 4px 8px; border-top: 1px solid var(--panel-border); }
  table.tiers tr.reached td { background: rgba(82, 209, 122, 0.12); }
</style>
</head>

<script>
  const ALBUMS = JSON.parse(document.getElementById('album-data').textContent);
  const ITEMS = JSON.parse(document.getElementById('item-data').textContent);
  const TIERS = JSON.parse(document.getElementById('tier-data').textContent);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
  const fmt = (n) => n.toLocaleString();
  const cacheBust = Date.now();
  const imageObserver = new IntersectionObserver((entries) => {
    entries.filter((entry) => entry.isIntersecting).forEach((entry) => {
      entry.target.src = entry.target.dataset.src;
      imageObserver.unobserve(entry.target);
    });
  }, { rootMargin: '10000px 0px' });
  const image = (path, cls, alt) => { const img = el('img', cls); img.dataset.src = '../..' + path + '?v=' + cacheBust; img.alt = alt; img.decoding = 'async'; imageObserver.observe(img); return img; };
  function rewardChip(r) {
    const chip = el('span', 'reward');
    const item = r.itemId ? ITEMS[r.itemId] : null;
    if (item && item.img) chip.append(image(item.img, 'item', ''));
    chip.append(el('span', '', fmt(r.amount) + ' ' + (item ? item.name : 'unknown item') + (r.size ? ' (' + r.size + ')' : '')));
    return chip;
  }
  function pieceCell(piece) {
    const cell = el('figure', 'piece');
    cell.title = piece.name || piece.id;
    if (piece.img) cell.append(image(piece.img, 'piece-img', piece.name || piece.id));
    else cell.append(el('div', 'piece-img nopic', 'No image'));
    cell.append(el('figcaption', '', piece.name || '#' + piece.id.split('-').pop()));
    return cell;
  }
  function albumPanel(album) {
    const panel = el('section', 'card');
    const pieces = album.puzzles.flatMap((p) => p.pieces);
    const totals = [1, 2, 3, 4, 5].map((s) => pieces.filter((p) => p.stars === s).length);
    const head = el('div', 'head');
    head.append(el('span', 'buff', 'Buff: ' + album.buff.stat + ' ' + album.buff.value));
    const done = el('span', 'inline', 'Completion rewards: ');
    album.completionRewards.forEach((r) => done.append(rewardChip(r)));
    head.append(done);
    panel.append(head);
    panel.append(el('p', 'note', album.puzzles.length + ' puzzles, ' + pieces.length + ' pieces: ' + totals.map((n, i) => n + ' at ' + (i + 1) + ' star' + (i ? 's' : '')).join(', ') + '.'));
    const puzzles = el('div', 'puzzles');
    album.puzzles.forEach((puzzle, i) => {
      const box = el('div', 'puzzle');
      const top = el('div', 'ptop');
      top.append(image(puzzle.img, 'art', puzzle.name));
      const info = el('div', 'pinfo');
      info.append(el('strong', '', (i + 1) + '. ' + puzzle.name), el('span', 'inline', puzzle.pieces.length + ' pieces'), rewardChip(puzzle.reward));
      const counts = [1, 2, 3, 4, 5].map((s) => puzzle.pieces.filter((p) => p.stars === s).length);
      info.append(el('div', 'counts', counts.map((n, k) => (k + 1) + '\u2605 ' + n).join('   ')));
      top.append(info);
      box.append(top);
      const grid = el('div', 'pieces');
      puzzle.pieces.forEach((p) => grid.append(pieceCell(p)));
      box.append(grid);
      puzzles.append(box);
    });
    panel.append(puzzles);
    return panel;
  }
  function tiersPanel() {
    const panel = el('section', 'card');
    panel.append(el('p', 'note', 'A reward for the total of pieces that you have collected over all albums. There are ' + TIERS.length + ' tiers, and each tier gives 2 rewards.'));
    const controls = el('div', 'head');
    const label = el('label', 'inline', 'Pieces collected ');
    const input = el('input', 'pieces-input');
    input.type = 'number'; input.min = '0'; input.value = '0'; input.id = 'pieces-collected';
    label.append(input);
    const summary = el('span', 'buff', '');
    summary.id = 'tiers-reached';
    controls.append(label, summary);
    panel.append(controls);
    const table = el('table', 'tiers');
    const head = el('tr');
    ['Tier', 'Pieces', 'Reward 1', 'Reward 2'].forEach((h) => head.append(el('th', '', h)));
    table.append(head);
    const rows = TIERS.map((tier) => {
      const row = el('tr');
      row.append(el('td', '', String(tier.tier)), el('td', '', fmt(tier.pieces)));
      tier.rewards.forEach((r) => { const cell = el('td'); cell.append(rewardChip(r)); row.append(cell); });
      table.append(row);
      return row;
    });
    function update() {
      const pieces = Number(input.value) || 0;
      let reached = 0;
      TIERS.forEach((tier, i) => { const on = tier.pieces <= pieces; if (on) reached++; rows[i].className = on ? 'reached' : ''; });
      summary.textContent = reached + ' of ' + TIERS.length + ' tiers reached';
    }
    input.addEventListener('input', update);
    update();
    panel.append(table);
    return panel;
  }
  function render() {
    const tabs = document.getElementById('tabs');
    const root = document.getElementById('albums');
    const panels = ALBUMS.map((album) => { const p = albumPanel(album); root.append(p); return p; });
    const buttons = ALBUMS.map((album, i) => {
      const b = el('button', 'chip', album.name + ' (' + album.puzzles.length + ')');
      b.type = 'button'; b.dataset.tab = album.id;
      b.addEventListener('click', () => show(i));
      tabs.append(b);
      return b;
    });
    const tiersIndex = panels.length;
    const tiers = tiersPanel(); root.append(tiers); panels.push(tiers);
    const tiersButton = el('button', 'chip', 'Piece count rewards (' + TIERS.length + ')');
    tiersButton.type = 'button'; tiersButton.dataset.tab = 'piece-count-rewards';
    tiersButton.addEventListener('click', () => show(tiersIndex));
    tabs.append(tiersButton); buttons.push(tiersButton);
    function show(active) {
      panels.forEach((p, i) => { p.style.display = i === active ? '' : 'none'; });
      buttons.forEach((b, i) => b.classList.toggle('active', i === active));
    }
    show(0);
  }
  render();
</script>
