<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Research Tech Tree</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #16202c;
    --panel-border: #26374a;
    --text: #e6edf5;
    --text-dim: #8fa1b3;
    --accent: #4fc3f7;
    --gate: #c99fef;
    --hub: #ffb84f;
    --ghost: #5a6675;
    --line: #3a86c8;
    --node-bg: #1c2e42;
    --node-border: #2f4b68;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 60px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { color: var(--text-dim); margin: 0 0 18px; font-size: 0.85rem; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .tab.active {
    background: var(--accent);
    color: #06222e;
    border-color: var(--accent);
    font-weight: 600;
  }
  .meta { color: var(--text-dim); font-size: 0.82rem; margin-bottom: 16px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 0.78rem; color: var(--text-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
  .scroll-wrap {
    overflow: auto;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    background: var(--panel);
    padding: 24px;
  }
  .tree-canvas { position: relative; }
  .tree-canvas svg { position: absolute; top: 0; left: 0; overflow: visible; }
  .node {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 76px;
  }
  .node.up { flex-direction: column-reverse; }
  .node-tier {
    position: absolute;
    top: -6px;
    left: 2px;
    background: var(--accent);
    color: #06222e;
    font-size: 0.6rem;
    font-weight: 700;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    z-index: 2;
  }
  .node.up .node-tier { top: auto; bottom: -6px; }
  .node-icon {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    border: 2px solid var(--node-border);
    background: var(--node-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    z-index: 1;
  }
  .node-icon img { width: 100%; height: 100%; object-fit: cover; }
  .node-icon.hub { width: 60px; height: 60px; border-color: var(--hub); box-shadow: 0 0 14px rgba(255,184,79,0.6); }
  .node-ghost {
    width: 60px;
    height: 52px;
    border-radius: 12px;
    border: 2px dashed var(--ghost);
    background: transparent;
    color: var(--ghost);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 1.2rem;
  }
  .node-name {
    margin-top: 4px;
    font-size: 0.62rem;
    text-align: center;
    line-height: 1.15;
    color: var(--text);
    max-width: 76px;
  }
  .node-levels {
    margin-top: 2px;
    font-size: 0.6rem;
    color: var(--text-dim);
    background: #0f1720;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 1px 6px;
  }
</style>
</head>

const CATEGORIES = [
  "Battle", "Growth", "Economy", "War Academy Troops",
  "T12 Infantry", "T12 Marksman", "T12 Lancer",
];
let active = "Battle";

const RANK_GAP = 150;  // spacing along the flow direction (top->bottom, or left->right)
const LANE_GAP = 96;   // spacing across the flow direction
const NODE_W = 76;
const NODE_H = 52;
const NODE_LABEL_H = 42; // icon + name text + level pill below it
const BRANCH_LANE_GAP = NODE_H + NODE_LABEL_H + 30; // vertical spacing within a side branch's own stack

function computeRanks(nodes, parents) {
  const rank = new Map();
  function computeRank(id, seen) {
    if (rank.has(id)) return rank.get(id);
    if (seen.has(id)) return 0;
    seen.add(id);
    const ps = parents.get(id);
    const r = ps.length === 0 ? 0 : Math.max(...ps.map(p => computeRank(p, seen))) + 1;
    rank.set(id, r);
    return r;
  }
  nodes.forEach(n => computeRank(n.id, new Set()));
  return rank;
}

// Pure layout over an explicit node/edge set — returns LOCAL positions
// (rank 0 starts near the origin), independent of any particular tab.
function layoutGraph(nodes, edges, orientation) {
  const horizontal = orientation === 'horizontal';
  const nodeIds = new Set(nodes.map(n => n.id));
  const parents = new Map(nodes.map(n => [n.id, []]));
  const children = new Map(nodes.map(n => [n.id, []]));
  edges.forEach(e => {
    if (!nodeIds.has(e.from) || !nodeIds.has(e.to)) return;
    children.get(e.from).push(e.to);
    parents.get(e.to).push(e.from);
  });

  const rank = computeRanks(nodes, parents);
  const maxRank = Math.max(...nodes.map(n => rank.get(n.id)));
  const ranks = [];
  for (let r = 0; r <= maxRank; r++) {
    ranks.push(nodes.filter(n => rank.get(n.id) === r).map(n => n.id));
  }
  ranks.forEach(group => group.sort());

  const along = new Map();
  const across = new Map();
  ranks.forEach((group, r) => {
    group.forEach((id, i) => {
      along.set(id, r * RANK_GAP + RANK_GAP / 2);
      across.set(id, i * LANE_GAP + LANE_GAP / 2);
    });
  });

  function barycenterPass(forward) {
    const order = forward ? ranks.slice(1) : ranks.slice(0, -1).reverse();
    order.forEach(group => {
      const scored = group.map(id => {
        const neighbors = forward ? parents.get(id) : children.get(id);
        const vals = neighbors.map(p => across.get(p)).filter(v => v !== undefined);
        const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : across.get(id);
        return { id, avg };
      });
      scored.sort((a, b) => a.avg - b.avg);
      scored.forEach((s, i) => across.set(s.id, i * LANE_GAP + LANE_GAP / 2));
    });
  }
  for (let pass = 0; pass < 4; pass++) {
    barycenterPass(true);
    barycenterPass(false);
  }

  const maxLanes = Math.max(...ranks.map(group => group.length));
  const acrossExtent = maxLanes * LANE_GAP;
  ranks.forEach(group => {
    const groupExtent = group.length * LANE_GAP;
    const offset = (acrossExtent - groupExtent) / 2;
    group.forEach((id, i) => across.set(id, offset + i * LANE_GAP + LANE_GAP / 2));
  });

  const pos = new Map();
  nodes.forEach(n => {
    const a = along.get(n.id);
    const c = across.get(n.id);
    pos.set(n.id, horizontal ? { x: a, y: c } : { x: c, y: a });
  });

  const flowExtent = (maxRank + 1) * RANK_GAP;
  return {
    pos,
    width: horizontal ? flowExtent : acrossExtent,
    height: horizontal ? acrossExtent : flowExtent,
  };
}

function edgePath(p1, p2, orientation, fromIsUp, toIsUp, splitFraction) {
  if (orientation === 'horizontal') {
    const x1 = p1.x + NODE_W / 2;
    const x2 = p2.x - NODE_W / 2;
    const midX = x1 + (x2 - x1) * (splitFraction === undefined ? 0.5 : splitFraction);
    return `M ${x1} ${p1.y} H ${midX} V ${p2.y} H ${x2}`;
  }
  if (orientation === 'up') {
    // labels sit ABOVE the icon for 'up'-styled nodes, so a line only needs
    // to clear a label on the side that actually has one there (the hub
    // itself, feeding into an 'up' branch, keeps its normal label-below
    // style, so its own side needs no extra clearance)
    const y1 = p1.y - NODE_H / 2 - (fromIsUp ? NODE_LABEL_H : 0);
    const y2 = p2.y + NODE_H / 2 + (toIsUp ? 0 : NODE_LABEL_H);
    const midY = (y1 + y2) / 2;
    return `M ${p1.x} ${y1} V ${midY} H ${p2.x} V ${y2}`;
  }
  const y1 = p1.y + NODE_H / 2 + (fromIsUp ? 0 : NODE_LABEL_H);
  const y2 = p2.y - NODE_H / 2;
  const midY = (y1 + y2) / 2;
  return `M ${p1.x} ${y1} V ${midY} H ${p2.x} V ${y2}`;
}

function renderNode(canvas, node, p, orientation) {
  const kind = node.kind || 'research';
  const isUp = orientation === 'up';
  const nodeEl = document.createElement('div');
  nodeEl.className = 'node' + (isUp ? ' up' : '');
  nodeEl.style.left = (p.x - NODE_W / 2) + 'px';
  nodeEl.style.top = (isUp ? p.y - NODE_H / 2 - NODE_LABEL_H : p.y - NODE_H / 2) + 'px';

  if (kind === 'research' || kind === 'hub') {
    nodeEl.title = kind === 'hub'
      ? node.name
      : `${node.name}\n${node.levelCount} level${node.levelCount === 1 ? '' : 's'}` +
        (node.external ? '\n(real prerequisite from another troop line)' : '') +
        (node.img ? '' : '\n(no icon published yet)');

    if (node.tier !== undefined) {
      const tierEl = document.createElement('div');
      tierEl.className = 'node-tier';
      tierEl.textContent = 'T' + node.tier;
      nodeEl.appendChild(tierEl);
    }

    const iconEl = document.createElement('div');
    iconEl.className = 'node-icon' + (kind === 'hub' ? ' hub' : '');
    if (node.external) iconEl.style.borderColor = 'var(--gate)';
    if (node.img) {
      const img = document.createElement('img');
      img.src = '..' + node.img;
      img.alt = node.name;
      img.loading = 'lazy';
      iconEl.appendChild(img);
    } else {
      // no icon exists anywhere to reference (e.g. brand-new, not-yet-published content)
      iconEl.style.borderStyle = 'dashed';
      iconEl.style.borderColor = 'var(--ghost)';
      iconEl.textContent = '?';
      iconEl.style.color = 'var(--ghost)';
      iconEl.style.fontSize = '1.2rem';
    }
    nodeEl.appendChild(iconEl);

    const nameEl = document.createElement('div');
    nameEl.className = 'node-name';
    nameEl.textContent = node.name;
    nodeEl.appendChild(nameEl);

    if (kind === 'research') {
      const levelsEl = document.createElement('div');
      levelsEl.className = 'node-levels';
      levelsEl.textContent = `Lv 1–${node.levelCount}`;
      nodeEl.appendChild(levelsEl);
    }
  } else {
    const known = node.levelCount !== undefined;
    nodeEl.title = node.name + (known
      ? `\nLevel ${node.levelCount}\n(not yet published on the wiki — user-confirmed)`
      : '\n(referenced in prerequisite text, no page published yet)');
    const ghostEl = document.createElement('div');
    ghostEl.className = 'node-ghost';
    ghostEl.textContent = '?';
    nodeEl.appendChild(ghostEl);

    const nameEl = document.createElement('div');
    nameEl.className = 'node-name';
    nameEl.textContent = node.name;
    nodeEl.appendChild(nameEl);

    if (known) {
      const levelsEl = document.createElement('div');
      levelsEl.className = 'node-levels';
      levelsEl.textContent = `Lv ${node.levelCount}`;
      nodeEl.appendChild(levelsEl);
    }
  }

  canvas.appendChild(nodeEl);
}

function renderSingleTree(category) {
  const { nodes, edges, orientation, capstoneId, capstoneEdges } = DATA[category];
  // Tiers 2-6 hang off exactly the row above them alone, stacked below the
  // chain in tier order, each centered under the row above it. Tiers 7-8
  // branch sideways off the tier-3 node instead, so they're kept separate.
  const extraTierEdgeSets = ['tier2Edges', 'tier3Edges', 'tier4Edges', 'tier5Edges', 'tier6Edges']
    .map(key => DATA[category][key])
    .filter(Boolean);
  const extraTierIds = extraTierEdgeSets.map(edgeSet => [...new Set(edgeSet.map(e => e.to))].sort());
  const branchTierEdgeSets = ['tier7Edges', 'tier8Edges']
    .map(key => DATA[category][key])
    .filter(Boolean);
  const branchTierIds = branchTierEdgeSets.map(edgeSet => [...new Set(edgeSet.map(e => e.to))].sort());
  const skipIds = new Set(
    [capstoneId, ...extraTierIds.flat(), ...branchTierIds.flat()].filter(Boolean),
  );
  const mainNodes = capstoneId ? nodes.filter(n => !skipIds.has(n.id)) : nodes;
  const { pos } = layoutGraph(mainNodes, edges, orientation);

  if (capstoneId) {
    // the capstone sits on its own row below the chain, centered under it,
    // rather than continuing along the same rank progression
    const xs = mainNodes.map(n => pos.get(n.id).x);
    const centerX = (Math.min(...xs) + Math.max(...xs)) / 2;
    const rowY = Math.max(...mainNodes.map(n => pos.get(n.id).y));
    const capstoneY = rowY + RANK_GAP;
    pos.set(capstoneId, { x: centerX, y: capstoneY });

    let rowTop = capstoneY;
    extraTierIds.forEach(ids => {
      if (!ids.length) return;
      rowTop += RANK_GAP;
      const totalWidth = (ids.length - 1) * LANE_GAP;
      const startX = centerX - totalWidth / 2;
      ids.forEach((id, i) => pos.set(id, { x: startX + i * LANE_GAP, y: rowTop }));
    });

    // tier 7/8 branch off the tier-3 node itself, extending to the right —
    // this does not touch the tier 2-6 vertical stack's positions at all
    const tier3Edges = DATA[category].tier3Edges || [];
    const tier3Id = tier3Edges.length ? tier3Edges[0].to : null;
    const tier3Anchor = tier3Id ? pos.get(tier3Id) : null;
    if (tier3Anchor) {
      // clear past the widest row in the tier 2-6 stack below (e.g. 4 Molten
      // items spread across LANE_GAP) before the branch's first elbow, so
      // the connector line doesn't cut through it
      const stackHalfWidth = Math.max(
        0,
        ...extraTierIds.map(ids => ((ids.length - 1) * LANE_GAP) / 2),
      );
      let branchX = tier3Anchor.x + stackHalfWidth;
      let priorIds = null;
      branchTierIds.forEach(ids => {
        if (!ids.length) return;
        branchX += RANK_GAP;
        if (priorIds) {
          const ys = priorIds.map(id => pos.get(id).y);
          const centerY = (Math.min(...ys) + Math.max(...ys)) / 2;
          const totalHeight = (ids.length - 1) * BRANCH_LANE_GAP;
          const startY = centerY - totalHeight / 2;
          ids.forEach((id, i) => pos.set(id, { x: branchX, y: startY + i * BRANCH_LANE_GAP }));
        } else {
          const totalHeight = (ids.length - 1) * BRANCH_LANE_GAP;
          const startY = tier3Anchor.y - totalHeight / 2;
          ids.forEach((id, i) => pos.set(id, { x: branchX, y: startY + i * BRANCH_LANE_GAP }));
        }
        priorIds = ids;
      });
    }
  }

  const allIds = [
    ...mainNodes.map(n => n.id), ...(capstoneId ? [capstoneId] : []),
    ...extraTierIds.flat(), ...branchTierIds.flat(),
  ];
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  allIds.forEach(id => {
    const p = pos.get(id);
    minX = Math.min(minX, p.x - NODE_W / 2);
    maxX = Math.max(maxX, p.x + NODE_W / 2);
    minY = Math.min(minY, p.y - NODE_H / 2);
    maxY = Math.max(maxY, p.y + NODE_H / 2 + NODE_LABEL_H);
  });
  const dx = -minX + 20;
  const dy = -minY + 20;
  allIds.forEach(id => pos.set(id, { x: pos.get(id).x + dx, y: pos.get(id).y + dy }));
  const canvasWidth = maxX - minX + 40;
  const canvasHeight = maxY - minY + 40;

  const canvas = document.getElementById('canvas');
  canvas.style.width = canvasWidth + 'px';
  canvas.style.height = canvasHeight + 'px';
  canvas.innerHTML = '';

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', canvasWidth);
  svg.setAttribute('height', canvasHeight);
  const isUp = orientation === 'up';
  edges.forEach(e => {
    const p1 = pos.get(e.from);
    const p2 = pos.get(e.to);
    if (!p1 || !p2) return;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', edgePath(p1, p2, orientation, isUp, isUp));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#3a86c8');
    path.setAttribute('stroke-width', '2');
    svg.appendChild(path);
  });
  (capstoneEdges || [])
    .concat(['tier2Edges', 'tier3Edges', 'tier4Edges', 'tier5Edges', 'tier6Edges'].flatMap(key => DATA[category][key] || []))
    .forEach(e => {
      const p1 = pos.get(e.from);
      const p2 = pos.get(e.to);
      if (!p1 || !p2) return;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', edgePath(p1, p2, 'vertical', false, false));
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', '#3a86c8');
      path.setAttribute('stroke-width', '2');
      svg.appendChild(path);
    });
  // the tier 7/8 branch runs left-to-right off the tier-3 node, so it uses
  // the same elbow shape as the main horizontal chain, not the vertical drop
  // the tier 2-6 stack uses. Tier 3 -> tier 7 keeps one long shared trunk
  // that splits late, right before First Aid/Healing, rather than splitting
  // at the halfway point.
  [{ key: 'tier7Edges', splitFraction: 0.85 }, { key: 'tier8Edges', splitFraction: 0.5 }]
    .flatMap(({ key, splitFraction }) => (DATA[category][key] || []).map(e => ({ ...e, splitFraction })))
    .forEach(e => {
      const p1 = pos.get(e.from);
      const p2 = pos.get(e.to);
      if (!p1 || !p2) return;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', edgePath(p1, p2, 'horizontal', false, false, e.splitFraction));
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', '#3a86c8');
      path.setAttribute('stroke-width', '2');
      svg.appendChild(path);
    });
  canvas.appendChild(svg);

  mainNodes.forEach(node => {
    const p = pos.get(node.id);
    if (p) renderNode(canvas, node, p, orientation);
  });
  if (capstoneId) {
    const capstoneNode = nodes.find(n => n.id === capstoneId);
    renderNode(canvas, capstoneNode, pos.get(capstoneId));
  }
  [...extraTierIds.flat(), ...branchTierIds.flat()].forEach(id => {
    const node = nodes.find(n => n.id === id);
    if (node) renderNode(canvas, node, pos.get(id));
  });
}

// Independent trees (one per troop line) hanging off one shared hub icon —
// each branch is laid out on its own, then transformed so its own root sits
// immediately next to the hub in that branch's own flow direction.
function renderHubView(category) {
  const { hub, branches } = DATA[category];

  const hubX = NODE_W / 2 + 20;
  const hubY = NODE_H / 2 + 20;
  const allPos = new Map([[hub.id, { x: hubX, y: hubY }]]);
  const nodeOrientation = new Map();
  const allNodes = [hub];
  const allEdges = [];

  branches.forEach(branch => {
    // 'up' reuses the same axis mapping as 'vertical' for its local layout
    // (along -> y, across -> x); only the final placement direction differs
    const layoutOrientation = branch.orientation === 'up' ? 'vertical' : branch.orientation;
    const { pos: localPos } = layoutGraph(branch.nodes, branch.edges, layoutOrientation);
    const rootLocal = localPos.get(branch.rootId);

    let transform;
    if (branch.orientation === 'horizontal') {
      const shiftX = (hubX + NODE_W / 2 + RANK_GAP) - rootLocal.x;
      const shiftY = hubY - rootLocal.y;
      transform = p => ({ x: p.x + shiftX, y: p.y + shiftY });
    } else if (branch.orientation === 'vertical') {
      const shiftX = hubX - rootLocal.x;
      const shiftY = (hubY + NODE_H / 2 + RANK_GAP) - rootLocal.y;
      transform = p => ({ x: p.x + shiftX, y: p.y + shiftY });
    } else { // 'up': flip the along-axis so deeper ranks move further up
      const shiftX = hubX - rootLocal.x;
      const c = (hubY - NODE_H / 2 - RANK_GAP) + rootLocal.y;
      transform = p => ({ x: p.x + shiftX, y: c - p.y });
    }

    branch.nodes.forEach(n => {
      allPos.set(n.id, transform(localPos.get(n.id)));
      nodeOrientation.set(n.id, branch.orientation);
    });
    allNodes.push(...branch.nodes);
    branch.edges.forEach(e => allEdges.push({ ...e, orientation: branch.orientation }));
    allEdges.push({ from: hub.id, to: branch.rootId, orientation: branch.orientation });
  });

  // normalize so nothing sits at a negative coordinate (a wide lane, or an
  // 'up' branch's label sitting above its icon, can push past the hub's edge)
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  allPos.forEach((p, id) => {
    const isUp = nodeOrientation.get(id) === 'up';
    minX = Math.min(minX, p.x - NODE_W / 2);
    minY = Math.min(minY, isUp ? p.y - NODE_H / 2 - NODE_LABEL_H : p.y - NODE_H / 2);
    maxX = Math.max(maxX, p.x + NODE_W / 2);
    maxY = Math.max(maxY, isUp ? p.y + NODE_H / 2 : p.y + NODE_H / 2 + NODE_LABEL_H);
  });
  const dx = -minX + 20;
  const dy = -minY + 20;
  allPos.forEach((p, id) => allPos.set(id, { x: p.x + dx, y: p.y + dy }));
  const width = maxX - minX + 40;
  const height = maxY - minY + 40;

  const canvas = document.getElementById('canvas');
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  canvas.innerHTML = '';

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  allEdges.forEach(e => {
    const p1 = allPos.get(e.from);
    const p2 = allPos.get(e.to);
    if (!p1 || !p2) return;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const fromIsUp = nodeOrientation.get(e.from) === 'up';
    const toIsUp = nodeOrientation.get(e.to) === 'up';
    path.setAttribute('d', edgePath(p1, p2, e.orientation, fromIsUp, toIsUp));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#3a86c8');
    path.setAttribute('stroke-width', '2');
    svg.appendChild(path);
  });
  canvas.appendChild(svg);

  allNodes.forEach(node => {
    const p = allPos.get(node.id);
    if (p) renderNode(canvas, node, p, nodeOrientation.get(node.id));
  });

  return { totalNodes: allNodes.length, totalEdges: allEdges.length };
}

function render() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (cat === active ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => { active = cat; render(); };
    tabsEl.appendChild(btn);
  });

  const data = DATA[active];
  const legendEl = document.getElementById('legend');

  if (data.hub) {
    const { totalNodes, totalEdges } = renderHubView(active);
    const hasExternal = data.branches.some(b => b.nodes.some(n => n.external));
    document.getElementById('meta').textContent = `${totalNodes} nodes, ${totalEdges} links`;
    let html =
      '<span><i style="background:var(--node-bg);border:2px solid var(--node-border)"></i>Research node</span>' +
      '<span><i style="background:var(--node-bg);border:2px solid var(--hub)"></i>Fire Crystal Shard (shared visual root)</span>';
    if (hasExternal) {
      html += '<span><i style="background:var(--node-bg);border:2px solid var(--gate)"></i>Real prerequisite from another troop line</span>';
    }
    legendEl.innerHTML = html;
  } else {
    const ghostCount = data.nodes.filter(n => n.kind === 'unreleased').length;
    const totalEdges = data.edges.length +
      ['capstoneEdges', 'tier2Edges', 'tier3Edges', 'tier4Edges', 'tier5Edges', 'tier6Edges', 'tier7Edges', 'tier8Edges']
        .reduce((sum, key) => sum + (data[key] ? data[key].length : 0), 0);
    document.getElementById('meta').textContent =
      `${data.nodes.length} nodes${ghostCount ? ` (${ghostCount} unreleased)` : ''}, ${totalEdges} prerequisite links`;
    legendEl.innerHTML = ghostCount
      ? '<span><i style="border:2px dashed var(--ghost)"></i>Not yet published on the wiki — user-confirmed, name TBD where noted</span>'
      : '';
    renderSingleTree(active);
  }
}

render();
</script>
